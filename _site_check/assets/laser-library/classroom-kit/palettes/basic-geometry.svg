<svg xmlns="http://www.w3.org/2000/svg" width="216mm" height="170mm" viewBox="0 0 216 170">
<title>Basic Geometry Palette</title>
<desc>Exact-size primitive parts for Inkscape.</desc>
<metadata id="technology-commons-classroom-kit">{&quot;description&quot;:&quot;Exact-size primitive parts for Inkscape.&quot;,&quot;palette&quot;:&quot;basic-geometry&quot;,&quot;review_status&quot;:&quot;unverified&quot;,&quot;title&quot;:&quot;Basic Geometry Palette&quot;,&quot;units&quot;:&quot;mm&quot;,&quot;version&quot;:&quot;1.0.0&quot;}</metadata>
<text x="10" y="12" fill="#111111" stroke="none" font-family="Arial, sans-serif" font-size="7" font-weight="700" text-anchor="start" data-role="annotation">BASIC GEOMETRY</text>
<text x="10" y="20" fill="#7b8794" stroke="none" font-family="Arial, sans-serif" font-size="3.6" font-weight="400" text-anchor="start" data-role="annotation">Copy a named group; set exact W/H in Inkscape before arranging the project.</text>
<text x="10" y="27" fill="#7b8794" stroke="none" font-family="Arial, sans-serif" font-size="3.2" font-weight="400" text-anchor="start" data-role="annotation">RED = CUT · BLUE = SCORE · dimensions in mm · test before production</text>
<g id="component-rectangle-60x30" aria-label="Rectangle part" data-width-mm="60" data-height-mm="30">
<rect x="8" y="34" width="96" height="60" rx="2" ry="2" fill="none" stroke="#c5cbd3" stroke-width="0.25" vector-effect="non-scaling-stroke" stroke-dasharray="2 2" data-operation="ENGRAVE"/>
<text x="13" y="42" fill="#111111" stroke="none" font-family="Arial, sans-serif" font-size="4.3" font-weight="700" text-anchor="start" data-role="annotation">Rectangle part</text>
<text x="13" y="89" fill="#7b8794" stroke="none" font-family="Arial, sans-serif" font-size="3.2" font-weight="400" text-anchor="start" data-role="annotation">60 × 30</text>
<rect x="26" y="51" width="60" height="30" fill="none" stroke="#ff0000" stroke-width="0.25" vector-effect="non-scaling-stroke" data-operation="CUT"/>
</g>
