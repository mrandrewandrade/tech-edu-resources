<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Colour choices for a simple logo</title><desc id="desc">The same logo appears in black, two flat colours, three flat colours, and an unsuitable detailed gradient version.</desc>
  <defs><linearGradient id="busy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1b434"/><stop offset=".45" stop-color="#db5461"/><stop offset="1" stop-color="#6c5ce7"/></linearGradient></defs>
  <rect width="1200" height="430" rx="30" fill="#eef4f7"/><style>.title{font:700 27px 'Source Sans 3',Arial,sans-serif;fill:#0b2e4f}.label{font:700 21px 'Source Sans 3',Arial,sans-serif;fill:#0b2e4f}.note{font:500 17px 'Source Sans 3',Arial,sans-serif;fill:#405568}.card{fill:#fff;stroke:#9fb2c1;stroke-width:3}</style><text class="title" x="48" y="50">One shape system, four colour decisions</text>
  <g transform="translate(40 82)"><rect class="card" width="260" height="300" rx="18"/><text class="label" x="22" y="38">BLACK TEST</text><circle cx="92" cy="133" r="31" fill="#111820"/><path d="M51 236 139 91l88 145z" fill="#111820"/><path d="M37 253Q127 206 226 249" fill="none" stroke="#111820" stroke-width="18" stroke-linecap="round"/><text class="note" x="22" y="279">Must work first</text></g>
  <g transform="translate(325 82)"><rect class="card" width="260" height="300" rx="18"/><text class="label" x="22" y="38">2 COLOURS</text><circle cx="92" cy="133" r="31" fill="#f1b434"/><path d="M51 236 139 91l88 145z" fill="#2f6f52"/><path d="M37 253Q127 206 226 249" fill="none" stroke="#2f6f52" stroke-width="18" stroke-linecap="round"/><text class="note" x="22" y="279">Simple and strong</text></g>
  <g transform="translate(610 82)"><rect class="card" width="260" height="300" rx="18"/><text class="label" x="22" y="38">3 COLOURS</text><circle cx="92" cy="133" r="31" fill="#f1b434"/><path d="M51 236 139 91l88 145z" fill="#2f6f52"/><path d="M37 253Q127 206 226 249" fill="none" stroke="#2382b5" stroke-width="18" stroke-linecap="round"/><text class="note" x="22" y="279">Good maximum</text></g>
  <g transform="translate(895 82)"><rect class="card" width="260" height="300" rx="18"/><text class="label" x="22" y="38">TOO COMPLEX</text><circle cx="92" cy="133" r="31" fill="url(#busy)"/><path d="M51 236 139 91l88 145z" fill="url(#busy)"/><path d="M37 253Q127 206 226 249" fill="none" stroke="#6c5ce7" stroke-width="8" stroke-dasharray="8 7"/><path d="m38 88 184 160m0-160L38 248" stroke="#d63c3c" stroke-width="8"/><text class="note" x="22" y="279">No gradients or tiny detail</text></g>
</svg>
