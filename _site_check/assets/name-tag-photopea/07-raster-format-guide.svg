<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Student image format guide for name-tag artwork</title>
  <desc id="desc">Four visual cards compare JPG, PNG, WebP, and SVG, followed by a recommendation to use a transparent PNG for the Photopea engraving workflow.</desc>
  <defs>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f3557"/><stop offset="0.55" stop-color="#2d86a6"/><stop offset="1" stop-color="#f3b63f"/></linearGradient>
    <pattern id="checker" width="28" height="28" patternUnits="userSpaceOnUse"><rect width="28" height="28" fill="#fff"/><path d="M0 0h14v14H0zM14 14h14v14H14z" fill="#dfe5ea"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102739" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="690" rx="28" fill="#f5f8fa"/>
  <text x="60" y="68" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#102739">Which image format should I use?</text>
  <text x="60" y="106" font-family="Arial, sans-serif" font-size="20" fill="#405364">Match the file type to the job. The extension is a clue, not a guarantee of quality.</text>
  <g transform="translate(45 145)" filter="url(#shadow)">
    <rect width="260" height="390" rx="18" fill="#fff"/><rect x="18" y="18" width="224" height="132" rx="12" fill="url(#photo)"/><circle cx="185" cy="55" r="24" fill="#fff4bd" opacity=".9"/><path d="M18 135l60-62 50 44 35-30 79 63H18z" fill="#132f4c" opacity=".74"/>
    <text x="24" y="195" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#102739">JPG</text><text x="24" y="230" font-family="Arial, sans-serif" font-size="18" fill="#405364">Best for photographs</text><text x="24" y="264" font-family="Arial, sans-serif" font-size="17" fill="#405364">• Small, lossy file</text><text x="24" y="294" font-family="Arial, sans-serif" font-size="17" fill="#405364">• No transparency</text><text x="24" y="324" font-family="Arial, sans-serif" font-size="17" fill="#405364">• Can blur sharp logo edges</text><rect x="24" y="346" width="212" height="30" rx="15" fill="#fbe5e4"/><text x="130" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#8a2823">NOT OUR LOGO CHOICE</text>
  </g>
  <g transform="translate(330 145)" filter="url(#shadow)">
    <rect width="260" height="390" rx="18" fill="#fff"/><rect x="18" y="18" width="224" height="132" rx="12" fill="url(#checker)"/><image href="../branding/logo/aa-logo-transparent.png" x="80" y="25" width="100" height="118" preserveAspectRatio="xMidYMid meet"/>
    <text x="24" y="195" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#102739">PNG</text><text x="24" y="230" font-family="Arial, sans-serif" font-size="18" fill="#405364">Best for this logo</text><text x="24" y="264" font-family="Arial, sans-serif" font-size="17" fill="#405364">• Lossless sharp edges</text><text x="24" y="294" font-family="Arial, sans-serif" font-size="17" fill="#405364">• Supports transparency</text><text x="24" y="324" font-family="Arial, sans-serif" font-size="17" fill="#405364">• Easy Photopea handoff</text><rect x="24" y="346" width="212" height="30" rx="15" fill="#dff2e5"/><text x="130" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#176238">USE FOR THIS PROJECT</text>
  </g>
  <g transform="translate(615 145)" filter="url(#shadow)">
    <rect width="260" height="390" rx="18" fill="#fff"/><rect x="18" y="18" width="224" height="132" rx="12" fill="url(#photo)"/><rect x="55" y="46" width="150" height="80" rx="40" fill="#fff" opacity=".72"/><text x="130" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102739">smaller web file</text>
    <text x="24" y="195" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#102739">WebP</text><text x="24" y="230" font-family="Arial, sans-serif" font-size="18" fill="#405364">Best for efficient websites</text><text x="24" y="264" font-family="Arial, sans-serif" font-size="17" fill="#405364">• Lossy or lossless</text><text x="24" y="294" font-family="Arial, sans-serif" font-size="17" fill="#405364">• Can use transparency</text><text x="24" y="324" font-family="Arial, sans-serif" font-size="17" fill="#405364">• Not our default handoff</text><rect x="24" y="346" width="212" height="30" rx="15" fill="#e7eef5"/><text x="130" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#314b63">GOOD FOR THE WEB</text>
  </g>
  <g transform="translate(900 145)" filter="url(#shadow)">
    <rect width="260" height="390" rx="18" fill="#fff"/><rect x="18" y="18" width="224" height="132" rx="12" fill="#edf5fa"/><path d="M66 122L112 42l46 80M84 91h56" fill="none" stroke="#102739" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M175 116l20-35 20 35M183 102h24" fill="none" stroke="#177aa3" stroke-width="4" stroke-linecap="round"/>
    <text x="24" y="195" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#102739">SVG</text><text x="24" y="230" font-family="Arial, sans-serif" font-size="18" fill="#405364">Best for vector geometry</text><text x="24" y="264" font-family="Arial, sans-serif" font-size="17" fill="#405364">• Scales without pixels</text><text x="24" y="294" font-family="Arial, sans-serif" font-size="17" fill="#405364">• Excellent for cut paths</text><text x="24" y="324" font-family="Arial, sans-serif" font-size="17" fill="#405364">• Keep as an editable master</text><rect x="24" y="346" width="212" height="30" rx="15" fill="#e2eef7"/><text x="130" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#175b7e">USE IN LATER VECTOR WORK</text>
  </g>
  <g transform="translate(45 570)"><rect width="1115" height="78" rx="16" fill="#102739"/><text x="28" y="34" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">For the Photopea name tag:</text><text x="28" y="61" font-family="Arial, sans-serif" font-size="18" fill="#d8e7f1">Place a transparent PNG logo, keep the editable PSD, and export the full 3300 × 1200 px page as PNG.</text></g>
</svg>
