<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Typical five-terminal automotive relay trainer</title>
  <desc id="desc">The coil circuit at terminals 85 and 86 is separated from the contact circuit. Terminal 30 is the contact common, terminal 87 is normally open, and terminal 87a is normally closed for a typical ISO changeover relay. A fuse protects the load circuit and a driver controls the coil.</desc>
  <defs>
    <style>
      .wire{fill:none;stroke:#1d2a44;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#687386;stroke-width:4;stroke-dasharray:12 10}.box{fill:#eef5fb;stroke:#1769aa;stroke-width:3}.load{fill:#fff4e5;stroke:#a85d00;stroke-width:3}.node{fill:#1d2a44}.t{font:24px Arial,sans-serif;fill:#111}.s{font:20px Arial,sans-serif;fill:#111}.b{font:bold 27px Arial,sans-serif;fill:#111}.pin{font:bold 26px Arial,sans-serif;fill:#1769aa}.warn{font:bold 20px Arial,sans-serif;fill:#8b1a16}
    </style>
  </defs>
  <rect width="1000" height="560" fill="#fff"/>
  <text x="35" y="44" class="b">Typical ISO changeover relay — verify the actual relay and socket</text>
  <rect x="330" y="75" width="345" height="355" rx="18" fill="#fafcff" stroke="#1d2a44" stroke-width="4"/>
  <line x1="500" y1="88" x2="500" y2="416" class="dash"/>
  <text x="362" y="112" class="b">coil side</text>
  <text x="528" y="112" class="b">contact side</text>

  <text x="350" y="172" class="pin">86</text>
  <line x1="390" y1="164" x2="440" y2="164" class="wire"/>
  <rect x="440" y="164" width="40" height="176" rx="8" fill="#fff" stroke="#1d2a44" stroke-width="6"/>
  <line x1="440" y1="340" x2="390" y2="340" class="wire"/>
  <text x="350" y="350" class="pin">85</text>
  <text x="367" y="270" class="t">12 V coil</text>

  <circle cx="570" cy="292" r="9" class="node"/>
  <text x="534" y="330" class="pin">30</text>
  <line x1="570" y1="292" x2="635" y2="225" class="wire"/>
  <circle cx="645" cy="214" r="9" class="node"/>
  <text x="620" y="180" class="pin">87a</text>
  <circle cx="645" cy="332" r="9" class="node"/>
  <text x="625" y="374" class="pin">87</text>
  <text x="525" y="405" class="s">rest: 87a • energized: 87</text>
  <line x1="500" y1="292" x2="570" y2="292" class="wire"/>
  <line x1="645" y1="214" x2="675" y2="214" class="wire"/>
  <line x1="645" y1="332" x2="675" y2="332" class="wire"/>

  <rect x="25" y="130" width="245" height="245" rx="16" class="box"/>
  <text x="55" y="174" class="b">Control circuit</text>
  <text x="50" y="216" class="t">GPIO → resistor</text>
  <text x="50" y="252" class="t">→ approved driver</text>
  <text x="50" y="288" class="t">→ coil 85/86</text>
  <text x="50" y="330" class="s">add suppression if required</text>
  <line x1="270" y1="252" x2="330" y2="252" class="dash"/>

  <path d="M675 292 H755" class="dash"/>
  <rect x="755" y="145" width="220" height="250" rx="16" class="load"/>
  <text x="795" y="184" class="b">Load circuit</text>
  <text x="785" y="226" class="t">+12 V → fuse</text>
  <text x="785" y="260" class="t">→ terminal 30</text>
  <text x="785" y="294" class="t">terminal 87 →</text>
  <text x="785" y="328" class="t">lamp/quiet load</text>
  <text x="785" y="362" class="t">→ 0 V</text>

  <rect x="70" y="455" width="860" height="78" rx="10" fill="#fff5f4" stroke="#b3261e" stroke-width="3"/>
  <text x="92" y="486" class="warn">Terminal numbers describe functions, not guaranteed physical positions.</text>
  <text x="92" y="515" class="s">Built-in diode relays have coil polarity. Confirm part number, diagram, ratings, fuse, and suppression.</text>
</svg>
