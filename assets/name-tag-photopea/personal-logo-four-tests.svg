<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Four tests for a personal logo</title><desc id="desc">The logo is checked at 25 millimetres, in solid black, in white on a dark background, and in grayscale.</desc>
  <rect width="1200" height="420" rx="30" fill="#eef4f7"/><style>.title{font:700 27px 'Source Sans 3',Arial,sans-serif;fill:#0b2e4f}.label{font:700 21px 'Source Sans 3',Arial,sans-serif;fill:#0b2e4f}.note{font:500 17px 'Source Sans 3',Arial,sans-serif;fill:#405568}.card{fill:#fff;stroke:#9fb2c1;stroke-width:3}</style><text class="title" x="48" y="50">If one test fails, revise the shapes</text>
  <g transform="translate(40 82)"><rect class="card" width="260" height="285" rx="18"/><text class="label" x="22" y="38">SMALL</text><g transform="translate(85 95) scale(.55)"><circle cx="90" cy="70" r="36" fill="#111820"/><path d="M32 210 120 64l92 146z" fill="#111820"/><path d="M20 230Q110 180 220 225" fill="none" stroke="#111820" stroke-width="20" stroke-linecap="round"/></g><path d="M72 239h116" stroke="#22a6cc" stroke-width="5"/><path d="m72 230v18m116-18v18" stroke="#22a6cc" stroke-width="5"/><text class="note" x="87" y="268">25 mm wide</text></g>
  <g transform="translate(325 82)"><rect class="card" width="260" height="285" rx="18"/><text class="label" x="22" y="38">BLACK</text><circle cx="96" cy="120" r="31" fill="#111820"/><path d="M52 233 141 86l90 147z" fill="#111820"/><path d="M38 250Q130 198 232 246" fill="none" stroke="#111820" stroke-width="18" stroke-linecap="round"/><text class="note" x="67" y="268">One clear silhouette</text></g>
  <g transform="translate(610 82)"><rect width="260" height="285" rx="18" fill="#0b2e4f"/><text x="22" y="38" style="font:700 21px 'Source Sans 3',Arial,sans-serif;fill:#fff">WHITE</text><circle cx="96" cy="120" r="31" fill="#fff"/><path d="M52 233 141 86l90 147z" fill="#fff"/><path d="M38 250Q130 198 232 246" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"/><text x="63" y="268" style="font:500 17px 'Source Sans 3',Arial,sans-serif;fill:#fff">Works when reversed</text></g>
  <g transform="translate(895 82)"><rect class="card" width="260" height="285" rx="18"/><text class="label" x="22" y="38">GRAYSCALE</text><circle cx="96" cy="120" r="31" fill="#b5b5b5"/><path d="M52 233 141 86l90 147z" fill="#555"/><path d="M38 250Q130 198 232 246" fill="none" stroke="#888" stroke-width="18" stroke-linecap="round"/><text class="note" x="54" y="268">Meaning survives colour</text></g>
</svg>
