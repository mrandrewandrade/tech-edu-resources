<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Four font choices for the name Andrade</title>
  <desc id="desc">The same name appears in a balanced sans serif, a serif, a condensed heavy font, and a script font. Short captions compare how each choice reads.</desc>
  <rect width="1200" height="820" rx="28" fill="#f4f7fa"/>
  <text x="60" y="74" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#102a43">Same name. Same space. Different font.</text>
  <text x="60" y="116" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#486581">Which one can you read first?</text>

  <g>
    <rect x="55" y="155" width="530" height="275" rx="22" fill="#ffffff" stroke="#2b8a3e" stroke-width="4"/>
    <rect x="83" y="181" width="192" height="40" rx="20" fill="#e6f4ea"/>
    <text x="179" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#237032">BALANCED SANS</text>
    <text x="320" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="700" fill="#101820">ANDRADE</text>
    <text x="320" y="389" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#486581">Clear shapes • even spacing • open letters</text>
  </g>

  <g>
    <rect x="615" y="155" width="530" height="275" rx="22" fill="#ffffff" stroke="#d68b00" stroke-width="4"/>
    <rect x="643" y="181" width="102" height="40" rx="20" fill="#fff3cd"/>
    <text x="694" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#8a5a00">SERIF</text>
    <text x="880" y="322" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700" fill="#101820">ANDRADE</text>
    <text x="880" y="389" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#486581">Readable • more detail • different mood</text>
  </g>

  <g>
    <rect x="55" y="465" width="530" height="275" rx="22" fill="#ffffff" stroke="#d68b00" stroke-width="4"/>
    <rect x="83" y="491" width="204" height="40" rx="20" fill="#fff3cd"/>
    <text x="185" y="519" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#8a5a00">HEAVY + NARROW</text>
    <text x="320" y="636" text-anchor="middle" font-family="Impact, 'Arial Narrow', sans-serif" font-size="92" letter-spacing="2" fill="#101820">ANDRADE</text>
    <text x="320" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#486581">Strong from far away • can feel crowded</text>
  </g>

  <g>
    <rect x="615" y="465" width="530" height="275" rx="22" fill="#ffffff" stroke="#c92a2a" stroke-width="4"/>
    <rect x="643" y="491" width="105" height="40" rx="20" fill="#fde8e8"/>
    <text x="695" y="519" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#9b1c1c">SCRIPT</text>
    <text x="880" y="633" text-anchor="middle" font-family="'Segoe Script', 'Comic Sans MS', cursive" font-size="69" font-weight="700" fill="#101820">Andrade</text>
    <text x="880" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#486581">Personal feeling • slower to read quickly</text>
  </g>

  <text x="600" y="785" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#102a43">Compare at the same size. Then test the name from 2 metres away.</text>
</svg>
