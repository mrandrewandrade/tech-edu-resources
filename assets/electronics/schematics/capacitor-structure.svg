<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1F2430; }
    .title { font-size: 34px; font-weight: 700; fill: #1E2B55; }
    .label { font-size: 25px; font-weight: 700; fill: #1E2B55; }
    .body { font-size: 23px; }
    .small { font-size: 20px; fill: #6B7280; }
    .wire { stroke: #1E2B55; stroke-width: 7; fill: none; stroke-linecap: square; stroke-linejoin: round; }
    .thin { stroke: #1E2B55; stroke-width: 4; fill: none; }
    .blue { stroke: #1769AA; fill: #1769AA; }
  </style>

    <text x="60" y="65" class="title">Inside a capacitor</text>
    <rect x="190" y="155" width="55" height="360" rx="8" fill="#1769AA"/>
    <rect x="475" y="155" width="55" height="360" rx="8" fill="#1769AA"/>
    <rect x="245" y="155" width="230" height="360" fill="#E9F3FA" stroke="#1E2B55" stroke-width="4"/>
    <line x1="60" y1="335" x2="190" y2="335" class="wire"/>
    <line x1="530" y1="335" x2="660" y2="335" class="wire"/>
    <text x="135" y="130" class="label">plate</text>
    <text x="440" y="130" class="label">plate</text>
    <text x="295" y="345" class="label">dielectric</text>
    <text x="205" y="205" font-size="38" fill="#C62828">+</text>
    <text x="205" y="285" font-size="38" fill="#C62828">+</text>
    <text x="205" y="365" font-size="38" fill="#C62828">+</text>
    <text x="205" y="445" font-size="38" fill="#C62828">+</text>
    <text x="487" y="205" font-size="42" fill="#1769AA">−</text>
    <text x="487" y="285" font-size="42" fill="#1769AA">−</text>
    <text x="487" y="365" font-size="42" fill="#1769AA">−</text>
    <text x="487" y="445" font-size="42" fill="#1769AA">−</text>
    <text x="740" y="195" class="label">What it stores</text>
    <text x="740" y="245" class="body">Separated charge and energy</text>
    <text x="740" y="285" class="body">in an electric field.</text>
    <text x="740" y="385" class="label">What stays insulated</text>
    <text x="740" y="435" class="body">The dielectric separates</text>
    <text x="740" y="475" class="body">the conductive plates.</text>
    <text x="60" y="635" class="small">The first model says a capacitor stores charge. The fuller model tracks separated charge and field energy.</text>

</svg>
