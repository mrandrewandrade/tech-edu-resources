<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1F2430; }
    .title { font-size: 34px; font-weight: 700; fill: #1E2B55; }
    .label { font-size: 25px; font-weight: 700; fill: #1E2B55; }
    .body { font-size: 23px; }
    .small { font-size: 20px; fill: #6B7280; }
    .wire { stroke: #1E2B55; stroke-width: 7; fill: none; stroke-linecap: square; stroke-linejoin: round; }
    .thin { stroke: #1E2B55; stroke-width: 4; fill: none; }
    .blue { stroke: #1769AA; fill: #1769AA; }
  </style>

    <text x="60" y="65" class="title">Charge and discharge over five time constants</text>
    <line x1="120" y1="570" x2="1110" y2="570" class="wire"/>
    <line x1="120" y1="570" x2="120" y2="120" class="wire"/>
    <text x="1080" y="625" class="label">time</text>
    <text x="22" y="125" class="label">voltage</text>
    <line x1="300" y1="570" x2="300" y2="140" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="12 10"/>
    <line x1="480" y1="570" x2="480" y2="140" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="12 10"/>
    <line x1="1020" y1="570" x2="1020" y2="140" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="12 10"/>
    <text x="285" y="610" class="body">τ</text>
    <text x="455" y="610" class="body">2τ</text>
    <text x="995" y="610" class="body">5τ</text>
    <path d="M120 570 C220 390 260 300 300 280 C390 220 520 170 700 150 C820 138 930 132 1020 130" fill="none" stroke="#1769AA" stroke-width="9"/>
    <path d="M120 130 C220 310 260 400 300 420 C390 480 520 530 700 550 C820 562 930 568 1020 570" fill="none" stroke="#C62828" stroke-width="9"/>
    <circle cx="300" cy="280" r="10" fill="#1769AA"/>
    <text x="320" y="270" class="body">charge: 63.2%</text>
    <text x="650" y="195" class="label" fill="#1769AA">charging</text>
    <text x="650" y="515" class="label" fill="#C62828">discharging</text>

</svg>
