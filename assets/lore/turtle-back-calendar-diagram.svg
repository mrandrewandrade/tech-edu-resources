<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Reading the turtle's back as a thirteen Moon and twenty-eight day teaching calendar</title>
  <desc id="desc">A neutral instructional turtle diagram. Thirteen numbered centre sections represent the Moons. Twenty-eight small marks around the shell edge represent days in the teaching cycle.</desc>
  <defs>
    <style>
      .ink{fill:#18233d}.muted{fill:#5b6475}.outline{stroke:#18233d;stroke-width:5;stroke-linejoin:round}.label{font:700 30px 'Source Sans 3',Arial,sans-serif}.small{font:600 22px 'Source Sans 3',Arial,sans-serif}.number{font:700 22px 'Source Sans 3',Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.line{fill:none;stroke:#9a5639;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#9a5639"/></marker>
  </defs>
  <rect width="1200" height="820" rx="28" fill="#fbf7ef"/>
  <text x="600" y="62" class="label ink" text-anchor="middle">Read the pattern in two ways</text>
  <text x="600" y="96" class="small muted" text-anchor="middle">13 large centre sections for Moons + 28 small edge marks for days</text>

  <ellipse cx="600" cy="455" rx="370" ry="270" fill="#dce8d6" class="outline"/>
  <ellipse cx="600" cy="151" rx="64" ry="55" fill="#dce8d6" class="outline"/>
  <circle cx="577" cy="139" r="5" class="ink"/><circle cx="623" cy="139" r="5" class="ink"/>
  <path d="M562 169 Q600 190 638 169" class="line"/>
  <ellipse cx="273" cy="290" rx="72" ry="38" transform="rotate(-28 273 290)" fill="#dce8d6" class="outline"/>
  <ellipse cx="927" cy="290" rx="72" ry="38" transform="rotate(28 927 290)" fill="#dce8d6" class="outline"/>
  <ellipse cx="273" cy="619" rx="72" ry="38" transform="rotate(28 273 619)" fill="#dce8d6" class="outline"/>
  <ellipse cx="927" cy="619" rx="72" ry="38" transform="rotate(-28 927 619)" fill="#dce8d6" class="outline"/>
  <path d="M600 724 L568 774 L632 774 Z" fill="#dce8d6" class="outline"/>

