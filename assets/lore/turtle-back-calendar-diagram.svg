  <text x="52" y="382" class="label ink">13 Moons</text>
  <text x="52" y="416" class="small muted">large centre sections</text>

  <path d="M930 260 C902 270 890 286 865 306" class="line" marker-end="url(#arrow)"/>
  <text x="925" y="215" class="label ink">28 days</text>
  <text x="925" y="249" class="small muted">small edge marks</text>

  <text x="600" y="803" class="small muted" text-anchor="middle">Instructional schematic, not a copy of a community artwork or a claim about every turtle shell.</text>
