<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Text legibility examples</title>
  <desc id="desc">Four stacked examples compare text over a busy background, text on a solid background, text with a thin outline, and text with a heavy three-dimensional effect.</desc>
  <defs>
    <pattern id="busy" width="70" height="70" patternUnits="userSpaceOnUse">
      <rect width="70" height="70" fill="#d9ae71"/>
      <circle cx="15" cy="15" r="15" fill="#537b80"/>
      <path d="M0 60 L60 0 L70 10 L10 70 Z" fill="#7a4553"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="8" dy="9" stdDeviation="2" flood-color="#161616"/>
    </filter>
  </defs>
  <rect width="600" height="1180" rx="28" fill="#f6f1e7"/>
  <text x="36" y="55" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2933">Which treatment stays easy to read?</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(36 90)">
      <rect width="528" height="235" rx="22" fill="url(#busy)"/>
      <text x="264" y="126" text-anchor="middle" font-size="56" font-weight="700" fill="#f2d978">Nameplate</text>
      <rect y="182" width="528" height="53" fill="#7c2d36"/>
      <text x="22" y="216" font-size="23" font-weight="700" fill="#fff">Hard to predict</text>
    </g>
    <g transform="translate(36 360)">
      <rect width="528" height="235" rx="22" fill="url(#busy)"/>
      <rect x="54" y="58" width="420" height="90" rx="12" fill="#111827"/>
      <text x="264" y="120" text-anchor="middle" font-size="56" font-weight="700" fill="#fff">Nameplate</text>
      <rect y="182" width="528" height="53" fill="#275d4a"/>
      <text x="22" y="216" font-size="23" font-weight="700" fill="#fff">Solid background</text>
    </g>
    <g transform="translate(36 630)">
      <rect width="528" height="235" rx="22" fill="#5c7894"/>
      <text x="264" y="126" text-anchor="middle" font-size="56" font-weight="700" fill="#fff" stroke="#111827" stroke-width="5" paint-order="stroke">Nameplate</text>
      <rect y="182" width="528" height="53" fill="#275d4a"/>
      <text x="22" y="216" font-size="23" font-weight="700" fill="#fff">Thin, even outline</text>
    </g>
    <g transform="translate(36 900)">
      <rect width="528" height="235" rx="22" fill="#5c7894"/>
      <text x="264" y="126" text-anchor="middle" font-size="56" font-weight="900" fill="#e8a347" stroke="#7c2d36" stroke-width="12" paint-order="stroke" filter="url(#shadow)">Nameplate</text>
      <rect y="182" width="528" height="53" fill="#7c2d36"/>
      <text x="22" y="216" font-size="23" font-weight="700" fill="#fff">Too many effects</text>
    </g>
  </g>
</svg>
