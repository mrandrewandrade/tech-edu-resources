<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Text legibility examples</title>
  <desc id="desc">Four examples compare text over a busy background, text on a solid background, text with a thin outline, and text with a heavy three-dimensional effect.</desc>
  <defs>
    <pattern id="busy" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="#d9ae71"/>
      <circle cx="18" cy="18" r="18" fill="#537b80"/>
      <path d="M0 75 L75 0 L90 15 L15 90 Z" fill="#7a4553"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="10" dy="12" stdDeviation="2" flood-color="#161616"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="34" fill="#f6f1e7"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#1f2933">Which treatment stays easy to read?</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(60 110)">
      <rect width="510" height="220" rx="24" fill="url(#busy)"/>
      <text x="255" y="126" text-anchor="middle" font-size="64" font-weight="700" fill="#f2d978">Nameplate</text>
      <rect y="168" width="510" height="52" rx="0 0 24 24" fill="#7c2d36"/>
      <text x="24" y="202" font-size="24" font-weight="700" fill="#fff">Hard to predict</text>
    </g>
    <g transform="translate(630 110)">
      <rect width="510" height="220" rx="24" fill="url(#busy)"/>
      <rect x="55" y="68" width="400" height="84" rx="12" fill="#111827"/>
      <text x="255" y="128" text-anchor="middle" font-size="64" font-weight="700" fill="#fff">Nameplate</text>
      <rect y="168" width="510" height="52" fill="#275d4a"/>
      <text x="24" y="202" font-size="24" font-weight="700" fill="#fff">Solid background</text>
    </g>
    <g transform="translate(60 390)">
      <rect width="510" height="220" rx="24" fill="#5c7894"/>
      <text x="255" y="128" text-anchor="middle" font-size="64" font-weight="700" fill="#fff" stroke="#111827" stroke-width="5" paint-order="stroke">Nameplate</text>
      <rect y="168" width="510" height="52" fill="#275d4a"/>
      <text x="24" y="202" font-size="24" font-weight="700" fill="#fff">Thin, even outline</text>
    </g>
    <g transform="translate(630 390)">
      <rect width="510" height="220" rx="24" fill="#5c7894"/>
      <text x="255" y="128" text-anchor="middle" font-size="64" font-weight="900" fill="#e8a347" stroke="#7c2d36" stroke-width="13" paint-order="stroke" filter="url(#shadow)">Nameplate</text>
      <rect y="168" width="510" height="52" fill="#7c2d36"/>
      <text x="24" y="202" font-size="24" font-weight="700" fill="#fff">Too many effects</text>
    </g>
  </g>
</svg>
