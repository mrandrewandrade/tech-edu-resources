<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Faux-enamel badge orthographic drawing and section</title>
  <desc id="desc">Third-angle orthographic drawing showing aligned top, front and right-side views of a 50 millimetre circular brooch, plus section A-A showing the three millimetre base, one millimetre raised walls and two polish-filled recessed pockets.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M8 0 0 4 8 8Z" fill="#172033"/>
    </marker>
    <marker id="section-arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#172033"/>
    </marker>
    <pattern id="pla-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#596579" stroke-width="2"/>
    </pattern>
    <pattern id="background-fill" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#eef2f7"/>
      <circle cx="2" cy="2" r="1.4" fill="#7c8798"/>
    </pattern>
    <pattern id="logo-fill" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f4c64f"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#604b13" stroke-width="2"/>
    </pattern>
    <style>
      .sheet{fill:#fff;stroke:#9aa5b4;stroke-width:2}
      .object{fill:none;stroke:#172033;stroke-width:4;stroke-linejoin:round}
      .thin{fill:none;stroke:#172033;stroke-width:2}
      .hidden{fill:none;stroke:#596579;stroke-width:2;stroke-dasharray:12 8}
      .centre{fill:none;stroke:#677489;stroke-width:1.8;stroke-dasharray:24 6 4 6}
      .projection{fill:none;stroke:#b7c0cc;stroke-width:1.5;stroke-dasharray:4 7}
      .dimension{fill:none;stroke:#172033;stroke-width:1.8;marker-start:url(#arrow);marker-end:url(#arrow)}
      .extension{fill:none;stroke:#596579;stroke-width:1.5}
      .cutline{fill:none;stroke:#172033;stroke-width:2.5;stroke-dasharray:28 8 5 8}
      .wall{fill:#283347;stroke:#172033;stroke-width:2}
      .base{fill:url(#pla-hatch);stroke:#172033;stroke-width:3}
      .bgfill{fill:url(#background-fill);stroke:#172033;stroke-width:1.5}
      .logofill{fill:url(#logo-fill);stroke:#172033;stroke-width:1.5}
      .heading{font:600 25px Arial,sans-serif;letter-spacing:1px;fill:#172033}
      .view{font:600 20px Arial,sans-serif;letter-spacing:1.4px;fill:#172033}
      .label{font:500 18px Arial,sans-serif;fill:#172033}
      .note{font:400 16px Arial,sans-serif;fill:#465267}
      .dimtext{font:500 17px Arial,sans-serif;fill:#172033}
    </style>
  </defs>

  <rect x="20" y="20" width="1160" height="960" class="sheet"/>
  <text x="55" y="68" class="heading">FAUX-ENAMEL BROOCH: ORTHOGRAPHIC VIEWS</text>
  <text x="1145" y="60" text-anchor="end" class="note">THIRD-ANGLE PROJECTION</text>
  <text x="1145" y="84" text-anchor="end" class="note">ALL DIMENSIONS IN mm</text>
  <line x1="55" y1="103" x2="1145" y2="103" class="thin"/>

  <g aria-label="Top view">
    <text x="350" y="142" text-anchor="middle" class="view">TOP</text>
    <circle cx="350" cy="330" r="145" class="wall"/>
    <circle cx="350" cy="330" r="132" class="bgfill"/>
    <path d="M350 224 430 312 410 329 365 280 365 432 335 432 335 280 290 329 270 312Z
             M350 248 404 309 396 315 356 271 356 419 344 419 344 271 304 315 296 309Z"
          fill="#283347" fill-rule="evenodd" stroke="#172033" stroke-width="2" stroke-linejoin="round"/>
    <path d="M350 248 404 309 396 315 356 271 356 419 344 419 344 271 304 315 296 309Z" class="logofill"/>
    <line x1="175" y1="330" x2="525" y2="330" class="centre"/>
    <line x1="350" y1="155" x2="350" y2="505" class="centre"/>
    <line x1="195" y1="330" x2="505" y2="330" class="cutline"/>
    <line x1="195" y1="330" x2="160" y2="330" class="thin" marker-end="url(#section-arrow)"/>
    <line x1="505" y1="330" x2="540" y2="330" class="thin" marker-end="url(#section-arrow)"/>
    <text x="148" y="337" text-anchor="end" class="label">A</text>
    <text x="552" y="337" class="label">A</text>
    <line x1="205" y1="183" x2="205" y2="140" class="extension"/>
    <line x1="495" y1="183" x2="495" y2="140" class="extension"/>
    <line x1="205" y1="155" x2="495" y2="155" class="dimension"/>
    <rect x="313" y="142" width="74" height="26" fill="#fff"/>
    <text x="350" y="161" text-anchor="middle" class="dimtext">⌀ 50</text>
  </g>

  <line x1="205" y1="485" x2="205" y2="625" class="projection"/>
  <line x1="350" y1="485" x2="350" y2="625" class="projection"/>
  <line x1="495" y1="485" x2="495" y2="625" class="projection"/>

  <g aria-label="Front view">
    <text x="350" y="554" text-anchor="middle" class="view">FRONT</text>
    <path d="M205 590H495V630H205Z" class="object"/>
    <path d="M205 580V590M219 580V590M481 580V590M495 580V590" class="object"/>
    <line x1="335" y1="580" x2="335" y2="630" class="hidden"/>
    <line x1="365" y1="580" x2="365" y2="630" class="hidden"/>
    <line x1="350" y1="566" x2="350" y2="642" class="centre"/>
    <line x1="510" y1="580" x2="560" y2="580" class="extension"/>
    <line x1="510" y1="590" x2="560" y2="590" class="extension"/>
    <line x1="510" y1="630" x2="560" y2="630" class="extension"/>
    <line x1="545" y1="580" x2="545" y2="590" class="dimension"/>
    <line x1="545" y1="590" x2="545" y2="630" class="dimension"/>
    <text x="568" y="590" class="dimtext">1 wall</text>
    <text x="568" y="616" class="dimtext">3 base</text>
  </g>

  <g aria-label="Right-side view">
    <text x="865" y="554" text-anchor="middle" class="view">RIGHT SIDE</text>
    <path d="M720 590H1010V630H720Z" class="object"/>
    <path d="M720 580V590M734 580V590M996 580V590M1010 580V590" class="object"/>
    <line x1="850" y1="580" x2="850" y2="630" class="hidden"/>
    <line x1="880" y1="580" x2="880" y2="630" class="hidden"/>
    <line x1="865" y1="566" x2="865" y2="642" class="centre"/>
    <text x="865" y="662" text-anchor="middle" class="note">Vertical scale enlarged for clarity</text>
  </g>

  <g aria-label="Section A-A through the filled cavities">
    <text x="600" y="718" text-anchor="middle" class="view">SECTION A-A: AFTER FILLING</text>
    <rect x="210" y="815" width="780" height="72" class="base"/>
    <rect x="210" y="791" width="24" height="96" class="wall"/>
    <rect x="470" y="791" width="24" height="96" class="wall"/>
    <rect x="706" y="791" width="24" height="96" class="wall"/>
    <rect x="966" y="791" width="24" height="96" class="wall"/>
    <rect x="234" y="796" width="236" height="19" class="bgfill"/>
    <rect x="494" y="796" width="212" height="19" class="logofill"/>
    <rect x="730" y="796" width="236" height="19" class="bgfill"/>
    <text x="350" y="774" text-anchor="middle" class="label">background colour</text>
    <line x1="350" y1="779" x2="350" y2="796" class="thin"/>
    <text x="600" y="774" text-anchor="middle" class="label">logo colour</text>
    <line x1="600" y1="779" x2="600" y2="796" class="thin"/>
    <text x="850" y="774" text-anchor="middle" class="label">background colour</text>
    <line x1="850" y1="779" x2="850" y2="796" class="thin"/>
    <line x1="1008" y1="791" x2="1060" y2="791" class="extension"/>
    <line x1="1008" y1="815" x2="1060" y2="815" class="extension"/>
    <line x1="1008" y1="887" x2="1060" y2="887" class="extension"/>
    <line x1="1045" y1="791" x2="1045" y2="815" class="dimension"/>
    <line x1="1045" y1="815" x2="1045" y2="887" class="dimension"/>
    <text x="1068" y="807" class="dimtext">1</text>
    <text x="1068" y="857" class="dimtext">3</text>
    <line x1="210" y1="914" x2="990" y2="914" class="dimension"/>
    <line x1="210" y1="894" x2="210" y2="928" class="extension"/>
    <line x1="990" y1="894" x2="990" y2="928" class="extension"/>
    <rect x="574" y="900" width="52" height="28" fill="#fff"/>
    <text x="600" y="920" text-anchor="middle" class="dimtext">50</text>
  </g>

  <g aria-label="Line and fill legend">
    <line x1="720" y1="160" x2="780" y2="160" class="object"/>
    <text x="793" y="166" class="note">visible edge</text>
    <line x1="720" y1="194" x2="780" y2="194" class="hidden"/>
    <text x="793" y="200" class="note">hidden edge</text>
    <line x1="720" y1="228" x2="780" y2="228" class="centre"/>
    <text x="793" y="234" class="note">centre line</text>
    <rect x="720" y="254" width="60" height="22" class="base"/>
    <text x="793" y="271" class="note">sectioned PLA</text>
    <rect x="720" y="290" width="60" height="22" class="bgfill"/>
    <text x="793" y="307" class="note">background fill</text>
    <rect x="720" y="326" width="60" height="22" class="logofill"/>
    <text x="793" y="343" class="note">logo fill</text>
  </g>

  <line x1="55" y1="946" x2="1145" y2="946" class="thin"/>
  <text x="55" y="970" class="note">Nominal 50 mm brooch shown. Use the dimension table for the 30 mm earring version.</text>
</svg>
