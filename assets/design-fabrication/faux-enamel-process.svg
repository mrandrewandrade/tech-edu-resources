<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Faux enamel pin project process</title>
  <desc id="desc">A five-stage diagram moves from original sketch through parametric Onshape model, slicing and orientation, print and finish, and evidence-based revision.</desc>
  <rect width="1200" height="320" rx="28" fill="#f7f4ee"/>
  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <g transform="translate(40 65)"><rect width="190" height="190" rx="20" fill="#fff" stroke="#142536" stroke-width="4"/><path d="M55 125 90 60l28 38 24-25 24 52Z" fill="none" stroke="#b76537" stroke-width="8"/><text x="95" y="158" font-size="21" fill="#142536">1 · ORIGINAL</text><text x="95" y="184" font-size="21" fill="#142536">SKETCH</text></g>
    <g transform="translate(270 65)"><rect width="190" height="190" rx="20" fill="#fff" stroke="#142536" stroke-width="4"/><path d="M48 128V62h96v66h-30V95H78v33Z" fill="#d9a66b" stroke="#142536" stroke-width="5"/><text x="95" y="158" font-size="21" fill="#142536">2 · ONSHAPE</text><text x="95" y="184" font-size="21" fill="#142536">SOURCE MODEL</text></g>
    <g transform="translate(500 65)"><rect width="190" height="190" rx="20" fill="#fff" stroke="#142536" stroke-width="4"/><path d="M45 124h100M55 108h80M65 92h60M75 76h40" stroke="#b76537" stroke-width="9"/><text x="95" y="158" font-size="21" fill="#142536">3 · SLICE +</text><text x="95" y="184" font-size="21" fill="#142536">ORIENT</text></g>
    <g transform="translate(730 65)"><rect width="190" height="190" rx="20" fill="#fff" stroke="#142536" stroke-width="4"/><circle cx="95" cy="95" r="55" fill="#d9a66b" stroke="#142536" stroke-width="6"/><path d="M62 105 88 65l20 30 24-18" fill="none" stroke="#fff" stroke-width="9"/><text x="95" y="166" font-size="21" fill="#142536">4 · PRINT +</text><text x="95" y="192" font-size="21" fill="#142536">FINISH</text></g>
    <g transform="translate(960 65)"><rect width="200" height="190" rx="20" fill="#142536"/><path d="M58 100a45 45 0 1 1 22 38" fill="none" stroke="#d9a66b" stroke-width="10"/><path d="m54 136 29 3-5-29" fill="none" stroke="#d9a66b" stroke-width="10"/><text x="100" y="166" font-size="21" fill="#fff">5 · EVALUATE</text><text x="100" y="192" font-size="21" fill="#fff">+ REVISE</text></g>
