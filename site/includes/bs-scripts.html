<script>
(function () {
  "use strict";
  const base = ["/commons", "/tech-edu-resources"].find(function (candidate) {
    return window.location.pathname === candidate ||
      window.location.pathname.startsWith(candidate + "/");
  }) || "";

  window.terEquationSources = [];
  document.querySelectorAll("span.math.display").forEach(function (equation, index) {
    const source = equation.textContent
      .trim()
      .replace(/^\\\[\s*/, "")
      .replace(/\s*\\\]$/, "")
      .replace(/\s*\\tag\{[^}]+\}\s*$/, "")
      .trim();
    const key = "ter-equation-" + (index + 1);
    equation.dataset.terEquationKey = key;
    window.terEquationSources.push({ key: key, source: source });
  });

  [
    "commons-lore.js",
    "bs-learn.js",
    "bs-glossary.js",
    "bs-reference-titles.js",
    "bs-learn-scroll.js",
    "tej-equations-v1.js",
    "tej-diagram-sources.js"
  ].forEach(function (file) {
    const versions = {
      "bs-learn.js": "20261017-1",
      "bs-learn-scroll.js": "20261013-1",
      "tej-equations-v1.js": "20261017-1",
      "tej-diagram-sources.js": "20261017-1"
    };
    const script = document.createElement("script");
    script.src = base + "/assets/" + file +
      (versions[file] ? "?v=" + versions[file] : "");
    script.async = false;
    document.body.appendChild(script);
  });
})();
</script>
