project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!mindfulness/"
    - "!posts/"
    - "!research/"
  pre-render:
  - python ../scripts/bs_pre_render.py
  resources:
    - "assets/icons/**"
    - "assets/branding/**"
    - assets/nice-design-tool.js
    - assets/bs-learn.js
    - assets/bs-learn-scroll.js
    - assets/bs-learn-sequence.json
    - assets/bs-research-index.js
    - assets/bs-glossary.js
    - assets/commons-lore.js
    - assets/teacher-slides.js
    - assets/teacher-slides.css
    - "assets/laser-cutting/**"
    - "assets/laser-library/**"
    - assets/laser-library.js
    - assets/bs-glossary-lookup.json
    - "assets/lore/**"

filters:
  - bs-link-policy

website:
  title: "Technological Education Resources"
  site-url: "https://andrewandrade.ca/tech-edu-resources/"
  repo-url: "https://github.com/mrandrewandrade/tech-edu-resources"
  description: "Open Ontario Technological Education classroom resources, slides, assignments, collaborative notes, and reusable teaching materials."
  open-graph: true
  twitter-card: true
  search:
    location: navbar
    type: overlay
  navbar:
    logo: assets/branding/pcss/tech-edu-resources.png
    logo-alt: "Technological Education Resources"
    title: "Tech Edu"
    collapse-below: xl
    left:
      - text: TAS
        menu:
          - href: slides/tas.qmd
            text: Slides
          - href: tas2/index.qmd
            text: Notes
      - text: TEJ
        menu:
          - href: slides/tej.qmd
            text: Slides
          - href: tej3-4/index.qmd
            text: Notes
    right:
      - text: Educator Resources
        menu:
          - href: teacher-slides/index.qmd
            text: Slides
          - href: teaching-materials/index.qmd
            text: Materials
      - href: glossary/index.qmd
        text: Glossary
      - href: lore/index.qmd
        text: Lore
      - href: about.qmd
        text: About
  sidebar:
    - id: tas2
      title: "TAS Notes"
      style: docked
      collapse-level: 2
      contents:
        - text: "Course Home"
          href: tas2/index.qmd
        - section: "0. Expectations"
          href: tas2/00-expectations/index.qmd
          contents: []
        - section: "1. N.I.C.E. Design Process"
          href: tas2/01-nice-design-process/index.qmd
          contents:
            - text: "1.1 Needs & Necessities"
              href: tas2/01-nice-design-process/01-needs-necessities.qmd
            - text: "1.2 Investigate & Inquire"
              href: tas2/01-nice-design-process/02-investigate-inquire.qmd
    - id: tej
      title: "TEJ Notes"
      style: docked
      collapse-level: 2
      contents:
        - text: "Course Home"
          href: tej3-4/index.qmd
        - section: "0. Expectations"
          href: tej3-4/00-expectations/index.qmd
          contents: []
        - section: "1. Number Systems"
          href: tej3-4/01-number-systems/index.qmd
          contents:
            - text: "1.1 Significant Figures"
              href: tej3-4/01-number-systems/01-significant-figures.qmd
            - text: "1.2 Powers of 10"
              href: tej3-4/01-number-systems/02-powers-of-10.qmd
            - text: "1.3 Scientific Calculator"
              href: tej3-4/01-number-systems/06-scientific-calculator.qmd
            - text: "1.4 Scientific Notation"
              href: tej3-4/01-number-systems/03-scientific-notation.qmd
            - text: "1.5 Engineering Notation"
              href: tej3-4/01-number-systems/04-engineering-notation.qmd
            - text: "1.6 Metric Prefixes"
              href: tej3-4/01-number-systems/05-metric-prefixes.qmd
        - section: "2. Basic Electronics"
          href: tej3-4/02-basic-electronics/index.qmd
          contents:
            - text: "2.1 Charge, Voltage & Current"
              href: tej3-4/02-basic-electronics/01-charge-voltage-current.qmd
            - text: "2.2 Closed, Open & Short Circuits"
              href: tej3-4/02-basic-electronics/02-circuits-opens-shorts.qmd
            - text: "2.3 Ohm's Law"
              href: tej3-4/02-basic-electronics/03-ohms-law.qmd
            - text: "2.4 Power & Energy"
              href: tej3-4/02-basic-electronics/04-power-energy.qmd
  page-footer:
    left: |
      Website code: [AGPL 3.0](https://andrewandrade.ca/commons/licensing.html). Educational content: [CC BY-SA 4.0](https://andrewandrade.ca/commons/licensing.html).

      Educational content may be shared, copied, modified, and redistributed. Keep the CC BY-SA 4.0 licence and credit Andrew Andrade, [andrewandrade.ca](https://andrewandrade.ca/), and [github.com/mrandrewandrade](https://github.com/mrandrewandrade). Add your own name and links when adapting it. **Sharing is caring.**

      The website code uses the AGPL 3.0, a copyleft licence: if you share modified code or run a modified version as a network service, you must make the corresponding source code available under the same licence.
    right:
      - text: References
        href: references.qmd
      - text: Licensing
        href: licensing.qmd

format:
  html:
    theme: [cosmo, assets/bs-theme.scss]
    css:
      - assets/bs-shared.css
      - assets/bs-components.css
      - assets/commons-overrides.css
      - assets/bs-learn.css
    include-after-body:
      - includes/bs-scripts.html
    include-in-header:
      - includes/site-head.html
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    link-external-newwindow: false
    code-copy: true

execute:
  freeze: auto

editor: source
