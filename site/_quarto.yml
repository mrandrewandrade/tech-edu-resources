project:
  type: website
  output-dir: _site
  render:
    - "404.qmd"
    - "about.qmd"
    - "index.qmd"
    - "licensing.qmd"
    - "references.qmd"
    - "glossary/**/*.qmd"
    - "lore/**/*.qmd"
    - "slides/**/*.qmd"
    - "teacher-slides/**/*.qmd"
    - "teaching-materials/index.qmd"
