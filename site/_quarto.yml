    - "teaching-materials/nice-design-process/**/*.qmd"
    - "design-fabrication/index.qmd"
    - "design-fabrication/culture-land-based-learning/**/*.qmd"
    - "design-fabrication/design-process/**/*.qmd"
    - "design-fabrication/logo-design/index.qmd"
    - "design-fabrication/logo-design/**/*.qmd"
    - "design-fabrication/01-nice-design-process/index.qmd"
    - "design-fabrication/02-digital-design/01-raster-vector-svg.qmd"
    - "design-fabrication/02-digital-design/03-logos-lettermarks.qmd"
    - "design-fabrication/02-digital-design/05-animation-ui-ux.qmd"
    - "design-fabrication/03-laser-cutting/index.qmd"
    - "design-fabrication/03-laser-cutting/01-name-logo.qmd"
    - "design-fabrication/tools/plate-builder/**/*.qmd"
    - "design-fabrication/tools/leg-builder/**/*.qmd"
    - "design-fabrication/tools/tool-organizer-gallery/**/*.qmd"
    - "design-fabrication/accessible-design/**/*.qmd"
    - "tej3-4/index.qmd"
    - "tej3-4/curriculum/**/*.qmd"
    - "tej3-4/circuits/**/*.qmd"
    - "tej3-4/engineering-preparation-track/**/*.qmd"
    - "tej3-4/electronics-library/**/*.qmd"
    - "tej3-4/linux-operating-systems/**/*.qmd"
    - "tej3-4/09-linux-operating-systems/**/*.qmd"
