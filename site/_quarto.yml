    - assets/tej-electronics.css
    - assets/tej-curriculum.js
    - assets/tej-curriculum.css
    - assets/tej-equations-v1.js
    - "assets/electronics/**"
    - "assets/name-tag-photopea/**"
    - "assets/accessible-design/**"
    - "assets/personal-logo-photopea/**"
    - "assets/laser-cutting/**"
    - "assets/laser-library/**"
    - assets/laser-library.js
    - assets/plate-builder.js
    - assets/leg-builder.js
    - assets/bs-glossary-lookup.json
    - "assets/lore/**"

metadata-files:
  - _course-navigation.yml

filters:
  - bs-link-policy

website:
  title: "Technological Education Resources"
  site-url: "https://andrewandrade.ca/tech-edu-resources/"
  repo-url: "https://github.com/mrandrewandrade/tech-edu-resources"
  description: "Open Ontario Technological Education classroom resources, slides, assignments, collaborative notes, and reusable teaching materials."
  open-graph: true
  twitter-card: true
  search:
    location: navbar
    type: overlay
  navbar:
    logo: assets/branding/pcss/tech-edu-resources.png
    logo-alt: "Technological Education Resources"
    title: "Tech Edu"
    collapse-below: xl
    left:
      - text: Educator Resources
        menu:
          - href: teacher-slides/index.qmd
            text: General Slides
          - href: teaching-materials/index.qmd
            text: General Materials
          - href: design-fabrication/index.qmd
            text: General Design & Fabrication
          - href: tej3-4/index.qmd
            text: Computer Engineering Notes
      - text: Classes
        menu:
          - href: slides/tas.qmd
            text: TAS Slides
          - href: slides/tej.qmd
            text: TEJ Slides
          - href: slides/ttj.qmd
            text: TTJ / TTS Slides
    right:
      - href: glossary/index.qmd
        text: Glossary
      - href: lore/index.qmd
        text: Lore
      - href: about.qmd
        text: About
  page-footer:
    left: |
      Website code: [AGPL 3.0](https://andrewandrade.ca/tech-edu-resources/licensing.html). Educational content: [CC BY-SA 4.0](https://andrewandrade.ca/tech-edu-resources/licensing.html).

      Educational content may be shared, copied, modified, and redistributed. Keep the CC BY-SA 4.0 licence and credit Andrew Andrade, [andrewandrade.ca](https://andrewandrade.ca/), and [github.com/mrandrewandrade](https://github.com/mrandrewandrade). Add your own name and links when adapting it. **Sharing is caring.**

      The website code uses the AGPL 3.0, a copyleft licence: if you share modified code or run a modified version as a network service, you must make the corresponding source code available under the same licence.
    right:
      - text: References
        href: references.qmd
      - text: Licensing
        href: licensing.qmd

format:
  html:
    theme: [cosmo, assets/bs-theme.scss]
    css:
      - assets/bs-shared.css
      - assets/bs-components.css
      - assets/commons-overrides.css
      - assets/bs-learn.css
      - assets/tej-curriculum.css
      - assets/tej-equations-v2.css
    include-after-body:
      - includes/bs-scripts.html
    include-in-header:
      - includes/site-head.html
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    link-external-newwindow: false
    code-copy: true

execute:
  freeze: auto

editor: source
