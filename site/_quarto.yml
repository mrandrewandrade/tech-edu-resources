project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!mindfulness/"
    - "!posts/"
    - "!research/"
  pre-render:
  - python ../scripts/bs_pre_render.py
  resources:
    - "assets/icons/**"
    - "assets/branding/**"
    - assets/nice-design-tool.js
    - assets/bs-learn.js
    - assets/bs-learn-scroll.js
    - assets/bs-learn-sequence.json
    - assets/bs-research-index.js
    - assets/bs-glossary.js
    - assets/commons-lore.js
    - assets/teacher-slides.js
    - assets/teacher-slides.css
    - assets/tej-electronics.js
    - assets/tej-electronics.css
    - assets/tej-curriculum.js
    - assets/tej-curriculum.css
    - "assets/laser-cutting/**"
    - "assets/laser-library/**"
    - assets/laser-library.js
    - assets/bs-glossary-lookup.json
    - "assets/lore/**"

filters:
  - bs-link-policy

