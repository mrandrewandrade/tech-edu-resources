filters:
  - bs-link-policy

website:
  title: "Technological Education Resources"
  site-url: "https://andrewandrade.ca/tech-edu-resources/"
  repo-url: "https://github.com/mrandrewandrade/tech-edu-resources"
  description: "Open Ontario Technological Education classroom resources, slides, assignments, collaborative notes, and reusable teaching materials."
  open-graph: true
  twitter-card: true
  search:
    location: navbar
    type: overlay
  navbar:
    logo: assets/branding/pcss/tech-edu-resources.png
    logo-alt: "Technological Education Resources"
    title: "Tech Edu"
    collapse-below: xl
    left:
      - text: Educator Resources
        menu:
          - href: teacher-slides/index.qmd
            text: General Slides
          - href: teaching-materials/index.qmd
            text: General Materials
          - href: design-fabrication/index.qmd
            text: General Design & Fabrication
          - href: tej3-4/index.qmd
            text: TEJ Notes
      - text: Classes
        menu:
          - href: slides/tas.qmd
            text: TAS Slides
          - href: slides/tej.qmd
            text: TEJ Slides
          - href: slides/ttj.qmd
            text: TTJ / TTS Slides
    right:
      - href: glossary/index.qmd
        text: Glossary
      - href: lore/index.qmd
        text: Lore
      - href: about.qmd
        text: About
  sidebar:
    - id: design-fabrication
      title: "General Design & Fabrication"
      style: docked
      collapse-level: 2
      contents:
        - text: "Design & Fabrication Home"
          href: design-fabrication/index.qmd
        - text: "N.I.C.E. Design Process"
          href: design-fabrication/design-process/index.qmd
        - text: "Logo Design"
          href: design-fabrication/logo-design/index.qmd
        - text: "Tool Organizer Project"
          href: design-fabrication/laser-cutting/tool-organizer.qmd
        - section: "Fabrication Tools"
          href: teaching-materials/laser-cutting/index.qmd
          contents:
            - text: "Fabrication Plate Builder"
              href: design-fabrication/tools/plate-builder/index.qmd
            - text: "Laser-Cut Leg & Support Builder"
              href: design-fabrication/tools/leg-builder/index.qmd
            - text: "Tool Organizer Gallery"
              href: design-fabrication/tools/tool-organizer-gallery/index.qmd
            - text: "Laser-Cutting Files and Resources"
              href: teaching-materials/laser-cutting/index.qmd
    - id: tas2
      title: "General Design & Fabrication"
      style: docked
      contents:
        - href: design-fabrication/index.qmd
          text: "Open the reusable curriculum"
    - id: tej
      title: "TEJ Notes"
      style: docked
      collapse-level: 2
      contents:
        - text: "Course Home"
          href: tej3-4/index.qmd
        - text: "Engineering Preparation Track"
          href: tej3-4/engineering-preparation-track/index.qmd
        - text: "Electronics Lesson Library"
          href: tej3-4/electronics-library/index.qmd
        - section: "Circuits"
          href: tej3-4/circuits/index.qmd
          contents:
            - text: "Significant Figures"
              href: tej3-4/circuits/index.qmd#significant-figures
            - text: "Scientific & Engineering Notation"
              href: tej3-4/circuits/index.qmd#notation-and-metric-prefixes
            - text: "Ohm's Law & Power"
              href: tej3-4/circuits/index.qmd#ohms-law-and-power
            - text: "GUESS Method"
              href: tej3-4/circuits/index.qmd#guess-method
            - text: "Series Circuits"
              href: tej3-4/circuits/series-circuits.qmd
            - text: "Parallel Circuits"
              href: tej3-4/circuits/parallel-circuits.qmd
            - text: "Series-Parallel Circuits"
              href: tej3-4/circuits/series-parallel-circuits.qmd
            - text: "Kirchhoff's Laws"
              href: tej3-4/circuits/kirchhoffs-laws.qmd
            - text: "Linear Algebra for Circuits"
              href: tej3-4/circuits/linear-algebra-circuits.qmd
            - text: "Class Resources"
              href: tej3-4/circuits/index.qmd#questions-answers-and-class-artifacts
        - section: "Linux, Operating Systems & Networking"
          href: tej3-4/linux-operating-systems/index.qmd
          contents:
            - text: "Choosing a Linux Distribution"
              href: tej3-4/linux-operating-systems/choosing-a-distribution.qmd
            - text: "Install Linux Mint"
              href: tej3-4/linux-operating-systems/install-linux-mint.qmd
  page-footer:
    left: |
      Website code: [AGPL 3.0](https://andrewandrade.ca/commons/licensing.html). Educational content: [CC BY-SA 4.0](https://andrewandrade.ca/commons/licensing.html).

