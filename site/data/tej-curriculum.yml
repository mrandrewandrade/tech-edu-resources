    pathway: core
    prerequisites: [Unit 1]
    estimated_time: 8-12 periods
    simulation_requirement: Recommended for comparison
    physical_lab_requirement: Required low-voltage investigations
    equipment: [protected low-voltage source, DMM, resistive loads]
