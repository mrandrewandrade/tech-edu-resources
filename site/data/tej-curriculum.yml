    consumables: [resistors, LEDs or lamps, hookup wire, protective fuses as needed]
    safety_level: Low-voltage electrical
    student_deliverables: [concept explanations, GUESS calculations, measurement comparison]
    assessment_evidence: [correct quantity relationships, units, safety decisions]
    public_notes_route: tej3-4/02-basic-electronics/index.qmd
    student_handout: Published core lessons
    teacher_guide: Teacher controlled
    slides: Existing basic-electricity slides
    source_references: [GROB, AAC, OPEN-CIRCUITS]
    access_level: Public
    copyright_permissions_note: Public pages use original text and diagrams. Restricted sources remain teacher controlled.
    implementation_notes: Preserve the completed basic-electricity sequence and expand only with verified resources.
    module_defaults: &unit2_defaults
      status: Published
      pathway: core
      prerequisites: [Unit 1]
      estimated_time: 2-3 periods
      simulation_requirement: Recommended
      physical_lab_requirement: Required
      equipment: [protected low-voltage source, DMM, resistors]
      software: [Tinkercad Circuits]
      safety_level: Low-voltage electrical
      student_deliverables: [calculation, explanation, measured or simulated comparison]
