schema_version: 1
updated: 2026-10-04
title: TEJ Curriculum Roadmap
purpose: >-
  Curriculum-only public metadata for the complete TEJ learning pathway. This file
  must never contain student numbers, aliases, scores, private notes, credentials,
  teacher-only links, or leaderboard data.

statuses:
  - Published
  - Pilot
  - In development
  - Planned
  - Bonus
  - Restricted source

access_levels:
  - Public
  - Teacher only
  - Classroom restricted
  - External official source

sources:
  - source_id: ON-TEJ
    title: Ontario Technological Education, Grades 11 and 12
    use: Curriculum expectations and program framing
    url: https://www.edu.gov.on.ca/eng/curriculum/secondary/2009teched1112curr.pdf
    access_level: External official source
    copyright_permissions_note: Link to the official source. Do not republish the document as site content.
  - source_id: GROWING-SUCCESS
    title: Growing Success
    use: Assessment and evaluation policy
    url: https://www.edu.gov.on.ca/eng/policyfunding/growSuccess.pdf
    access_level: External official source
    copyright_permissions_note: Link to the official source. Summaries must be original.
  - source_id: AAC
    title: All About Circuits textbook
    use: Open electronics reference
    url: https://www.allaboutcircuits.com/textbook/
    access_level: External official source
    copyright_permissions_note: Link to the source and verify page-level licence requirements before reuse.
  - source_id: CASIO-FX991
    title: Casio fx-570ES PLUS and fx-991ES PLUS User's Guide
    use: Calculator workflow and notation
    url: https://www.casio.com/content/dam/casio/global/support/manuals/calculators/pdf/004-en/f/fx-570_991ES_PLUS_EN.pdf
    access_level: External official source
    copyright_permissions_note: Link to the official manual. Use original classroom explanations and screenshots only when permitted.
  - source_id: ISLP
    title: An Introduction to Statistical Learning with Python
    use: Teacher and reference source for the planned machine-learning pathway
    url: https://www.statlearning.com/
    access_level: External official source
    copyright_permissions_note: Link to the official site. Do not copy or republish the textbook.
  - source_id: GOOGLE-MLCC
    title: Google Machine Learning Crash Course
    use: Supplementary interactive machine-learning material
    url: https://developers.google.com/machine-learning/crash-course/
    access_level: External official source
    copyright_permissions_note: Link to selected official modules and follow the source licence and attribution requirements.
  - source_id: GOOGLE-RECSYS
    title: Google Recommendation Systems
    use: Supplementary recommender-systems material
    url: https://developers.google.com/machine-learning/recommendation
    access_level: External official source
    copyright_permissions_note: Link to the official course and follow the source licence and attribution requirements.
  - source_id: KARPATHY-ZERO-HERO
    title: Neural Networks - Zero to Hero
    use: Advanced reference after solid Python and introductory mathematics
    url: https://karpathy.ai/zero-to-hero.html
    access_level: External official source
    copyright_permissions_note: Link to the official course. Do not imply it is a required beginner course.
  - source_id: GROB
    title: Grob's Basic Electronics, 12th edition
    use: Teacher planning source for electronics sequencing and experiments
    url: ''
    access_level: Classroom restricted
    copyright_permissions_note: Classroom source available through the teacher. Do not upload scans or chapters publicly.
  - source_id: OPEN-CIRCUITS
    title: Open Circuits
    use: Restricted visual reference for component interiors
    url: ''
    access_level: Classroom restricted
    copyright_permissions_note: Classroom source available through the teacher. Use original diagrams or separately cleared assets publicly.
  - source_id: MAKE-ELECTRONICS
    title: Make - Electronics
    use: Teacher reference for hands-on build ideas
    url: ''
    access_level: Classroom restricted
    copyright_permissions_note: Classroom source available through the teacher. Do not publish copied pages or diagrams.

units:
  - unit_id: '0'
    title: Course Orientation, Safety, Design Process, and Documentation
    short_description: Establish safe practice, the design process, evidence standards, privacy, attribution, and documentation habits.
    status: Published
    pathway: core
    prerequisites: []
    estimated_time: 3-5 periods
    simulation_requirement: Optional orientation only
    physical_lab_requirement: Required safety orientation
    equipment: [PPE, emergency equipment, low-voltage training equipment]
    software: [Google Drive, browser]
    consumables: [safety agreement sheets, labels, ESD bags or protective packaging as needed]
    safety_level: Foundational
    student_deliverables: [safety agreement, design-process record, documentation sample]
    assessment_evidence: [safe conduct, hazard identification, clear source attribution]
    public_notes_route: tej3-4/00-expectations/index.qmd
    student_handout: Published course materials
    teacher_guide: Teacher controlled
    slides: Existing course orientation slides
    source_references: [ON-TEJ, GROWING-SUCCESS]
    access_level: Public
    copyright_permissions_note: Original summaries and openly shareable course materials only.
    implementation_notes: Keep safety, accessibility, privacy, and documentation visible throughout the course.
    module_defaults: &unit0_defaults
      status: Planned
      pathway: core
      prerequisites: []
      estimated_time: 1-2 periods
      simulation_requirement: Not required
      physical_lab_requirement: Required
      equipment: [PPE, classroom safety equipment]
      software: [Google Drive]
      safety_level: Foundational
      student_deliverables: [short safety or documentation record]
      assessment_evidence: [accurate procedure, safe practice, complete documentation]
      public_notes_route: Not yet available
      student_handout: Planned
      teacher_guide: Teacher controlled
      slides: Planned or existing course slides
      source_references: [ON-TEJ]
      access_level: Public
      copyright_permissions_note: Original course content and official links only.
      implementation_notes: Publish only after accessibility and classroom checks.
    modules:
      - module_id: OR01
        title: Course orientation and learning pathways
        short_description: Understand course expectations, core and optional pathways, assessment evidence, and how to use the public library.
        status: Published
        public_notes_route: tej3-4/00-expectations/index.qmd
      - module_id: H01
        title: Safety, emergency response, and ESD
        short_description: Identify electrical, thermal, mechanical, chemical, and electrostatic hazards and respond safely.
        status: Published
        public_notes_route: tej3-4/electronics-library/modules/h01-safety-lab-practice.qmd
      - module_id: OR03
        title: Design process and technical documentation
        short_description: Define needs, investigate options, plan, build, test, revise, cite sources, and keep an evidence trail.
        status: In development
        physical_lab_requirement: Optional
      - module_id: OR04
        title: Privacy, copyright, and responsible technology use
        short_description: Protect personal information, distinguish public and restricted sources, and document permitted reuse.
        status: In development
        physical_lab_requirement: Not required

  - unit_id: '1'
    title: Number Systems, Measurement, Units, and Calculator Skills
