    prerequisites: [Unit 0]
    estimated_time: 8-12 periods
    simulation_requirement: Not required
    physical_lab_requirement: Optional measurement stations
    equipment: [scientific calculator, ruler, DMM]
    software: [browser]
    consumables: [graph paper or calculation sheets, replacement calculator or meter batteries as needed]
    safety_level: Low
    student_deliverables: [worked calculations, calculator evidence, measurement record]
    assessment_evidence: [correct units, significant figures, notation, and calculator workflow]
    public_notes_route: tej3-4/01-number-systems/index.qmd
    student_handout: Published lessons and practice
    teacher_guide: Teacher controlled
    slides: Existing number-systems slides
    source_references: [CASIO-FX991, ON-TEJ]
    access_level: Public
    copyright_permissions_note: Original explanations with links to official manuals.
    implementation_notes: Keep calculator keystrokes secondary to mathematical meaning.
    module_defaults: &unit1_defaults
      status: Published
      pathway: core
      prerequisites: [Unit 0]
      estimated_time: 1-2 periods
      simulation_requirement: Not required
      physical_lab_requirement: Optional
      equipment: [scientific calculator]
      software: [browser]
      safety_level: Low
      student_deliverables: [worked examples and practice]
      assessment_evidence: [correct process, notation, units, and answer]
      public_notes_route: tej3-4/01-number-systems/index.qmd
      student_handout: Published lesson practice
      teacher_guide: Teacher controlled
      slides: Existing slides
      source_references: [CASIO-FX991]
      access_level: Public
      copyright_permissions_note: Original explanations and official links.
      implementation_notes: Maintain accessible examples and explicit calculator steps.
    modules:
      - module_id: "NS01"
        title: "Binary, decimal, and hexadecimal"
        short_description: "Convert and interpret values across number systems used in electronics and computing."
      - module_id: "NS02"
        title: "Measurement and units"
        short_description: "Record measured quantities with units and distinguish measured precision from exact counts."
      - module_id: "NS03"
        title: "Significant figures"
        short_description: "Apply significant-figure and decimal-place rules to calculations."
        public_notes_route: "tej3-4/01-number-systems/01-significant-figures.qmd"
      - module_id: "NS04"
        title: "Scientific notation and powers of ten"
        short_description: "Represent and calculate with very large and small values."
        public_notes_route: "tej3-4/01-number-systems/03-scientific-notation.qmd"
      - module_id: "NS05"
        title: "Engineering notation and metric prefixes"
        short_description: "Express technical values in powers of one thousand and standard prefixes."
        public_notes_route: "tej3-4/01-number-systems/04-engineering-notation.qmd"
      - module_id: "NS06"
        title: "Scientific calculator and GUESS workflow"
        short_description: "Enter expressions reliably and present Given, Unknown, Equation, Substitute, and Solve evidence."
        public_notes_route: "tej3-4/01-number-systems/06-scientific-calculator.qmd"

  - unit_id: '2'
    title: Electricity, Charge, Voltage, Current, Resistance, Power, and Energy
    short_description: Develop a practical model of electrical quantities, sources, loads, AC, and DC.
