      - module_id: "H02"
        title: "Charge, voltage, and current"
        short_description: "Relate charge, potential difference, current, and resistance to practical sources and loads."
        public_notes_route: "tej3-4/02-basic-electronics/01-charge-voltage-current.qmd"
      - module_id: "EL02"
        title: "Resistance, closed paths, opens, and shorts"
        short_description: "Explain opposition to current and identify safe and unsafe circuit states."
        public_notes_route: "tej3-4/02-basic-electronics/02-circuits-opens-shorts.qmd"
      - module_id: "H08"
        title: "Power and energy"
        short_description: "Calculate electrical power and energy and distinguish ratings from actual use."
        public_notes_route: "tej3-4/02-basic-electronics/04-power-energy.qmd"
      - module_id: "H03"
        title: "AC and DC"
        short_description: "Compare polarity, direction, waveform, frequency, common sources, and safe classroom measurements."
        status: "In development"

  - unit_id: '3'
    title: DC Circuit Analysis
    short_description: Analyze series, parallel, and mixed DC circuits with Ohm's law, KCL, KVL, dividers, equivalent resistance, and fault reasoning.
    status: In development
    pathway: core
    prerequisites: [Unit 2]
    estimated_time: 15-22 periods
    simulation_requirement: Required for verification
    physical_lab_requirement: Required
    equipment: [breadboards, protected DC sources, DMMs, resistor kits]
    software: [Tinkercad Circuits]
    consumables: [resistors, LEDs, hookup wire, replaceable protective fuses]
    safety_level: Low-voltage electrical
    student_deliverables: [GUESS calculations, schematics, simulations, measured comparisons, fault diagnosis]
    assessment_evidence: [equations before substitution, units, full calculator result, correct precision, interpretation]
    public_notes_route: tej3-4/02-basic-electronics/index.qmd
    student_handout: Partly published; full sequence in development
    teacher_guide: Teacher controlled
    slides: Existing and planned circuit-analysis slides
    source_references: [GROB, AAC, CASIO-FX991]
    access_level: Public
    copyright_permissions_note: Original worked examples and diagrams with citations.
    implementation_notes: Teach series first, parallel second, and mixed circuits only after students can explain and verify both rule sets.
    module_defaults: &unit3_defaults
      status: Planned
      pathway: core
      prerequisites: [H02, EL02]
      estimated_time: 2-3 periods
      simulation_requirement: Required
      physical_lab_requirement: Required
      equipment: [breadboard, protected DC source, DMM, resistors]
      software: [Tinkercad Circuits]
      safety_level: Low-voltage electrical
      student_deliverables: [GUESS solution, schematic, simulation, measurement table]
      assessment_evidence: [correct analysis and calculated-simulated-measured comparison]
      public_notes_route: Not yet available
      student_handout: Planned
      teacher_guide: Teacher controlled
      slides: Planned
      source_references: [GROB, AAC]
      access_level: Public
      copyright_permissions_note: Original calculations and diagrams only.
      implementation_notes: Build and verify the complete resource package before publication.
    modules:
      - module_id: "H07"
        title: "Ohm's law"
        short_description: "Solve for voltage, current, and resistance and check whether the answer is physically reasonable."
        status: "Published"
        public_notes_route: "tej3-4/02-basic-electronics/03-ohms-law.qmd"
      - module_id: "H09"
        title: "Series circuits"
        short_description: "Apply current equality, voltage division, equivalent resistance, total power, and open-circuit behaviour."
      - module_id: "H10"
        title: "Parallel circuits"
        short_description: "Apply voltage equality, branch current, total current, equivalent resistance, power, opens, and shorts."
      - module_id: "H11"
        title: "Series-parallel circuits with KCL and KVL"
        short_description: "Reduce mixed networks and use Kirchhoff's laws to solve and check them."
      - module_id: "H12"
        title: "Voltage dividers, current dividers, and equivalent resistance"
        short_description: "Design and analyze divider networks and recognize loading effects."
      - module_id: "H13"
        title: "Thevenin, Norton, and maximum power"
        short_description: "Model a network at two terminals as an advanced bridge."
        pathway: "extension"
        status: "Bonus"
      - module_id: "H16"
        title: "Faults, opens, shorts, and troubleshooting"
        short_description: "Predict symptoms and use evidence to locate a fault safely."
      - module_id: "DC07"
        title: "GUESS and calculator workflow"
        short_description: "Present a complete calculation trail with exact equations, units, precision, and an answer sentence."
        status: "Published"
        public_notes_route: "tej3-4/01-number-systems/06-scientific-calculator.qmd"

