version: 1

stat_labels:
  circuits: Circuits
  coding: Code
  measurement: Measure
  building: Build
  troubleshooting: Debug

regions:
  field-archive: {label: Field Archive}
  signal-station: {label: Signal Station}

readiness_levels:
  ready: {label: Ready, css_class: ready, teacher_gate: false}
  simulation_first: {label: Simulation first, css_class: ready, teacher_gate: false}
  power_off: {label: Power-off ready, css_class: ready, teacher_gate: false}
  teacher_check: {label: Teacher check, css_class: check, teacher_gate: true}
  input_check: {label: Input check, css_class: check, teacher_gate: true}
  driver_check: {label: Driver check, css_class: check, teacher_gate: true}
  part_check: {label: Part check, css_class: check, teacher_gate: true}
  buzzer_check: {label: Buzzer check, css_class: check, teacher_gate: true}
  shared_station: {label: Shared station, css_class: shared, teacher_gate: true}
  optional_online: {label: Optional online, css_class: shared, teacher_gate: true}

mission_pattern:
  minimum_success:
    - Identify the exact part, file, or system.
    - Make the minimum version work safely.
    - Measure or test one result.
    - Add the evidence to the course website and save it with Git.
  stages:
    - {id: identify, label: Identify, prompt: Record the part number, rating, pinout, command, or file you are actually using.}
    - {id: predict, label: Predict, prompt: State what should happen and calculate an expected value when the mission includes a circuit.}
    - {id: represent, label: Represent, prompt: Read or create the schematic, wiring diagram, flowchart, state table, or command sequence.}
    - {id: simulate, label: Simulate, prompt: Test the circuit or program virtually when a suitable simulator is available.}
    - {id: build, label: Build, prompt: Assemble or configure one small stage at a time and pass any required teacher check.}
    - {id: measure, label: Measure, prompt: Record an actual voltage, resistance, current, time, output, or test result with units.}
    - {id: troubleshoot, label: Troubleshoot, prompt: Compare expected and actual behaviour, isolate one cause, and record the correction.}
    - {id: improve, label: Improve, prompt: Add one extension only after the minimum version works.}
  evidence_types:
    - schematic or system diagram
    - calculation or prediction
    - simulation or code
    - measured result with units
    - photograph or screenshot
    - fault and correction
    - Git checkpoint

