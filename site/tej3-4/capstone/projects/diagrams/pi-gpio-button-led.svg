<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Raspberry Pi LED output and button input</title>
  <desc id="desc">GPIO17 drives a 330 ohm resistor and LED to ground. GPIO27 uses an internal pull-up and a normally open pushbutton to ground.</desc>
  <defs>
    <style>
      .w{fill:none;stroke:#18181b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .r{fill:none;stroke:#c62828;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .box{fill:#fff;stroke:#18181b;stroke-width:4}
      .h{font:700 27px Arial,sans-serif;fill:#111827}
      .t{font:22px Arial,sans-serif;fill:#111827}
      .s{font:18px Arial,sans-serif;fill:#374151}
    </style>
  </defs>
  <rect width="1200" height="500" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="h">Level 3: one output and one input</text>

  <rect x="40" y="92" width="300" height="330" rx="18" class="box"/>
  <text x="190" y="132" text-anchor="middle" class="h">Raspberry Pi 4</text>
  <circle cx="330" cy="205" r="8" fill="#18181b"/>
  <text x="305" y="180" text-anchor="end" class="t">GPIO17</text>
  <text x="305" y="240" text-anchor="end" class="s">physical pin 11</text>
  <circle cx="330" cy="315" r="8" fill="#18181b"/>
  <text x="305" y="290" text-anchor="end" class="t">GPIO27</text>
  <text x="305" y="350" text-anchor="end" class="s">physical pin 13</text>
  <text x="190" y="382" text-anchor="middle" class="s">GPIO Zero enables the internal pull-up.</text>
  <text x="190" y="407" text-anchor="middle" class="s">Code uses names 17 and 27.</text>

  <path d="M338 205H435L450 180L480 230L510 180L540 230L570 180L585 205H650" class="w"/>
  <text x="510" y="155" text-anchor="middle" class="h">330 Ω</text>
  <path d="M650 165V245L725 205Z" fill="#fff" stroke="#18181b" stroke-width="5"/>
  <path d="M725 160V250" class="w"/>
  <path d="M672 146L705 113M700 146L733 113" class="r"/>
  <text x="690" y="90" text-anchor="middle" class="h">LED</text>
  <path d="M725 205H1010V400" class="w"/>

  <path d="M338 315H610" class="w"/>
  <circle cx="625" cy="315" r="8" fill="#18181b"/>
  <circle cx="760" cy="315" r="8" fill="#18181b"/>
  <path d="M633 315L742 270" class="w"/>
  <path d="M760 315H1010" class="w"/>
  <text x="690" y="365" text-anchor="middle" class="t">normally open button</text>

  <path d="M940 400H1080M960 425H1060M985 450H1035" class="w"/>
  <text x="1010" y="485" text-anchor="middle" class="t">Pi GND, physical pin 6</text>
  <text x="600" y="470" text-anchor="middle" class="s">Shut down and unplug before moving any wire.</text>
</svg>
