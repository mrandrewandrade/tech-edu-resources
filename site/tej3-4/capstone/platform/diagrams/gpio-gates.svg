<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" role="img" aria-labelledby="title desc">
  <title id="title">Five GPIO learning gates</title><desc id="desc">Onboard LED, pin verification, external LED, button, and driver boundary.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker><style>.b{fill:#fff;stroke:#222;stroke-width:3;rx:12}.n{fill:#174a7e}.h{font:700 21px Arial,sans-serif}.t{font:18px Arial,sans-serif}.l{stroke:#222;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="1180" height="330" fill="#fff"/>
  <text x="590" y="34" text-anchor="middle" class="h">GPIO progression — do not skip a gate</text>
  <g transform="translate(25 75)"><rect class="b" width="190" height="155"/><circle class="n" cx="95" cy="32" r="22"/><text x="95" y="39" fill="#fff" text-anchor="middle" class="h">1</text><text x="95" y="78" text-anchor="middle" class="h">Onboard LED</text><text x="95" y="110" text-anchor="middle" class="t">No external</text><text x="95" y="136" text-anchor="middle" class="t">wiring</text></g>
  <line x1="220" y1="152" x2="250" y2="152" class="l"/>
  <g transform="translate(255 75)"><rect class="b" width="190" height="155"/><circle class="n" cx="95" cy="32" r="22"/><text x="95" y="39" fill="#fff" text-anchor="middle" class="h">2</text><text x="95" y="78" text-anchor="middle" class="h">Verify line</text><text x="95" y="110" text-anchor="middle" class="t">board + image</text><text x="95" y="136" text-anchor="middle" class="t">+ gpioinfo</text></g>
  <line x1="450" y1="152" x2="480" y2="152" class="l"/>
  <g transform="translate(485 75)"><rect class="b" width="190" height="155"/><circle class="n" cx="95" cy="32" r="22"/><text x="95" y="39" fill="#fff" text-anchor="middle" class="h">3</text><text x="95" y="78" text-anchor="middle" class="h">External LED</text><text x="95" y="110" text-anchor="middle" class="t">series resistor</text><text x="95" y="136" text-anchor="middle" class="t">first</text></g>
  <line x1="680" y1="152" x2="710" y2="152" class="l"/>
  <g transform="translate(715 75)"><rect class="b" width="190" height="155"/><circle class="n" cx="95" cy="32" r="22"/><text x="95" y="39" fill="#fff" text-anchor="middle" class="h">4</text><text x="95" y="78" text-anchor="middle" class="h">Button input</text><text x="95" y="110" text-anchor="middle" class="t">defined pull</text><text x="95" y="136" text-anchor="middle" class="t">resistor</text></g>
  <line x1="910" y1="152" x2="940" y2="152" class="l"/>
  <g transform="translate(945 75)"><rect class="b" width="210" height="155"/><circle class="n" cx="105" cy="32" r="22"/><text x="105" y="39" fill="#fff" text-anchor="middle" class="h">5</text><text x="105" y="78" text-anchor="middle" class="h">Driver stage</text><text x="105" y="110" text-anchor="middle" class="t">external power</text><text x="105" y="136" text-anchor="middle" class="t">+ protection</text></g>
  <text x="590" y="280" text-anchor="middle" class="h">Stop and obtain teacher approval at every arrow.</text>
</svg>
