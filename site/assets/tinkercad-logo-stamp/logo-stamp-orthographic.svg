<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Logo stamp coin orthographic drawing</title>
  <desc id="desc">Third-angle orthographic drawing of a 38 millimetre circular stamp coin with a 4 millimetre base and 2 millimetre raised mirrored logo relief.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 0 0 4 8 8Z" fill="#334155"/></marker>
    <style>
      .object{fill:#f8fafc;stroke:#0f2745;stroke-width:5;vector-effect:non-scaling-stroke}
      .relief{fill:#d8a20f;stroke:#0f2745;stroke-width:4;vector-effect:non-scaling-stroke}
      .hidden{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:10 8;vector-effect:non-scaling-stroke}
      .centre{fill:none;stroke:#2563eb;stroke-width:2;stroke-dasharray:18 6 3 6;vector-effect:non-scaling-stroke}
      .dim{fill:none;stroke:#334155;stroke-width:2.5;marker-start:url(#arrow);marker-end:url(#arrow);vector-effect:non-scaling-stroke}
      .ext{stroke:#64748b;stroke-width:2;vector-effect:non-scaling-stroke}
      .cut{stroke:#b91c1c;stroke-width:3;stroke-dasharray:14 8;vector-effect:non-scaling-stroke}
      .label{font:700 27px Arial,sans-serif;fill:#0f2745}
      .note{font:22px Arial,sans-serif;fill:#334155}
      .small{font:19px Arial,sans-serif;fill:#334155}
    </style>
  </defs>

  <text x="350" y="42" text-anchor="middle" class="label">TOP VIEW</text>
  <rect x="190" y="86" width="320" height="42" class="object"/>
  <rect x="270" y="65" width="160" height="21" class="relief"/>
  <line x1="350" y1="55" x2="350" y2="145" class="centre"/>
  <line x1="150" y1="86" x2="150" y2="128" class="dim"/>
  <line x1="160" y1="86" x2="190" y2="86" class="ext"/><line x1="160" y1="128" x2="190" y2="128" class="ext"/>
  <text x="125" y="112" text-anchor="end" class="small">4 mm base</text>
  <line x1="540" y1="65" x2="540" y2="86" class="dim"/>
  <line x1="430" y1="65" x2="552" y2="65" class="ext"/><line x1="430" y1="86" x2="552" y2="86" class="ext"/>
  <text x="565" y="82" class="small">2 mm relief</text>

  <text x="350" y="222" text-anchor="middle" class="label">FRONT VIEW - STAMPING FACE</text>
  <circle cx="350" cy="450" r="170" class="object"/>
  <line x1="150" y1="450" x2="550" y2="450" class="centre"/>
  <line x1="350" y1="250" x2="350" y2="650" class="centre"/>
  <path class="relief" fill-rule="evenodd" d="M350 321 455 431h-48l-57-61-57 61h-48Zm-25 107h50v129h-50Zm-58 69h166v35H267Z"/>
  <line x1="180" y1="690" x2="520" y2="690" class="dim"/>
  <line x1="180" y1="620" x2="180" y2="705" class="ext"/><line x1="520" y1="620" x2="520" y2="705" class="ext"/>
  <text x="350" y="730" text-anchor="middle" class="note">38 mm diameter</text>
  <line x1="180" y1="450" x2="520" y2="450" class="cut"/>
  <text x="160" y="438" text-anchor="end" class="small">A</text><text x="540" y="438" class="small">A</text>
  <text x="350" y="765" text-anchor="middle" class="small">Logo is mirrored before printing so the impression reads correctly.</text>

  <text x="720" y="222" text-anchor="middle" class="label">RIGHT-SIDE VIEW</text>
  <rect x="690" y="280" width="42" height="340" class="object"/>
  <rect x="669" y="370" width="21" height="160" class="relief"/>
  <line x1="650" y1="450" x2="770" y2="450" class="centre"/>
  <text x="780" y="432" class="small">Raised mirrored logo</text>
  <text x="780" y="462" class="small">Flat back reserved for handle</text>

  <text x="1080" y="42" text-anchor="middle" class="label">SECTION A-A</text>
  <rect x="900" y="150" width="360" height="180" fill="#dbeafe" stroke="#0f2745" stroke-width="5"/>
  <rect x="960" y="60" width="92" height="90" class="relief"/>
  <rect x="1110" y="60" width="92" height="90" class="relief"/>
  <line x1="900" y1="364" x2="1260" y2="364" class="dim"/>
  <line x1="900" y1="330" x2="900" y2="377" class="ext"/><line x1="1260" y1="330" x2="1260" y2="377" class="ext"/>
  <text x="1080" y="402" text-anchor="middle" class="note">38 mm</text>
  <line x1="1300" y1="150" x2="1300" y2="330" class="dim"/>
  <line x1="1260" y1="150" x2="1314" y2="150" class="ext"/><line x1="1260" y1="330" x2="1314" y2="330" class="ext"/>
  <text x="1320" y="247" class="small">4 mm</text>
  <line x1="860" y1="60" x2="860" y2="150" class="dim"/>
  <line x1="860" y1="60" x2="960" y2="60" class="ext"/><line x1="860" y1="150" x2="960" y2="150" class="ext"/>
  <text x="840" y="112" text-anchor="end" class="small">2 mm</text>
  <text x="1080" y="450" text-anchor="middle" class="note">Raised relief presses into clay or a teacher-approved stamp pad.</text>
  <text x="1080" y="490" text-anchor="middle" class="note">Minimum stroke and gap: 1.2 mm</text>
  <text x="1080" y="530" text-anchor="middle" class="note">Minimum clear edge margin: 3 mm</text>

  <g transform="translate(1050 600)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#0f2745" stroke-width="4"/>
    <circle cx="70" cy="0" r="26" fill="none" stroke="#0f2745" stroke-width="4"/>
    <path d="M-7-20 7-20 0 0Z" fill="#0f2745"/><path d="M63 20 77 20 70 0Z" fill="#0f2745"/>
    <text x="35" y="58" text-anchor="middle" class="small">Third-angle projection</text>
  </g>
</svg>
