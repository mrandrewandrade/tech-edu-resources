<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Begin clear colour-coded wiring</title>
  <desc id="desc">A partial two-loop circuit layout showing the required wire colours and right-angle routing. Several connections are intentionally unfinished.</desc>
  <rect width="1400" height="800" fill="#f5f7f9"/>
  <rect width="1400" height="72" fill="#fff" stroke="#cbd3dc"/>
  <text x="30" y="44" font-family="Arial, sans-serif" font-size="23" fill="#263746">TEJ Midterm Starter – partial wiring example</text>
  <rect x="1152" y="15" width="188" height="42" rx="6" fill="#fff" stroke="#1c6b96" stroke-width="2"/>
  <text x="1183" y="43" font-family="Arial, sans-serif" font-size="20" fill="#173b50">Start Simulation</text>
  <g transform="translate(75 265)">
    <rect width="225" height="175" rx="10" fill="#d7dadd" stroke="#8d979f" stroke-width="3"/>
    <rect x="18" y="22" width="120" height="58" fill="#dce9ec" stroke="#495158" stroke-width="6"/>
    <circle cx="178" cy="52" r="27" fill="#c6c7c7" stroke="#575d62" stroke-width="4"/>
    <circle cx="150" cy="150" r="10" fill="#d52b2b"/><circle cx="181" cy="150" r="10" fill="#30383f"/>
    <text x="20" y="-16" font-family="Arial" font-size="20" font-weight="700" fill="#263746">12 V supply</text>
  </g>
  <g transform="translate(1070 265)">
    <rect width="225" height="175" rx="10" fill="#d7dadd" stroke="#8d979f" stroke-width="3"/>
    <rect x="18" y="22" width="120" height="58" fill="#dce9ec" stroke="#495158" stroke-width="6"/>
    <circle cx="178" cy="52" r="27" fill="#c6c7c7" stroke="#575d62" stroke-width="4"/>
    <circle cx="150" cy="150" r="10" fill="#d52b2b"/><circle cx="181" cy="150" r="10" fill="#30383f"/>
    <text x="20" y="-16" font-family="Arial" font-size="20" font-weight="700" fill="#263746">9 V supply</text>
  </g>
  <g font-family="Arial" font-size="20" font-weight="700" fill="#263746">
    <text x="415" y="225">R1 2.2 kΩ</text><text x="848" y="225">R2 3.3 kΩ</text><text x="725" y="490">R3 1.0 kΩ</text>
  </g>
  <g stroke="#84572d" stroke-width="18" stroke-linecap="round"><line x1="430" y1="280" x2="560" y2="280"/><line x1="820" y1="280" x2="950" y2="280"/><line x1="700" y1="420" x2="700" y2="540"/></g>
  <g stroke="#525c63" stroke-width="6"><line x1="385" y1="280" x2="430" y2="280"/><line x1="560" y1="280" x2="610" y2="280"/><line x1="770" y1="280" x2="820" y2="280"/><line x1="950" y1="280" x2="1000" y2="280"/><line x1="700" y1="390" x2="700" y2="420"/><line x1="700" y1="540" x2="700" y2="585"/></g>
  <polyline points="225,415 225,620 660,620" fill="none" stroke="#111820" stroke-width="9" stroke-linejoin="round"/>
  <polyline points="1251,415 1251,620 740,620" fill="none" stroke="#111820" stroke-width="9" stroke-linejoin="round"/>
  <polyline points="225,415 225,210 385,210 385,280" fill="none" stroke="#d32828" stroke-width="9" stroke-linejoin="round"/>
  <polyline points="1220,415 1220,210 1000,210 1000,280" fill="none" stroke="#d32828" stroke-width="9" stroke-linejoin="round"/>
  <polyline points="610,280 650,280 650,360 690,360" fill="none" stroke="#2376d2" stroke-width="9" stroke-linejoin="round"/>
  <polyline points="770,280 750,280 750,360 710,360" fill="none" stroke="#26964a" stroke-width="9" stroke-linejoin="round"/>
  <polyline points="700,360 700,390" fill="none" stroke="#783ab8" stroke-width="9"/>
  <circle cx="700" cy="360" r="13" fill="#6e28a7"/>
  <line x1="700" y1="585" x2="700" y2="620" stroke="#111820" stroke-width="9" stroke-dasharray="11 10"/>
  <line x1="660" y1="620" x2="740" y2="620" stroke="#111820" stroke-width="9" stroke-dasharray="11 10"/>
  <text x="765" y="604" font-family="Arial" font-size="18" font-weight="700" fill="#9a2b2b">Finish this return connection</text>
  <g transform="translate(55 650)" font-family="Arial" font-size="18" fill="#263746">
    <rect width="550" height="125" rx="10" fill="#fff" stroke="#aab7c1"/>
    <line x1="24" y1="34" x2="82" y2="34" stroke="#d32828" stroke-width="8"/><text x="95" y="41">red: positive supply</text>
    <line x1="24" y1="68" x2="82" y2="68" stroke="#111820" stroke-width="8"/><text x="95" y="75">black: common return</text>
    <line x1="285" y1="34" x2="343" y2="34" stroke="#2376d2" stroke-width="8"/><text x="356" y="41">blue: left loop</text>
    <line x1="285" y1="68" x2="343" y2="68" stroke="#26964a" stroke-width="8"/><text x="356" y="75">green: right loop</text>
    <line x1="285" y1="102" x2="343" y2="102" stroke="#783ab8" stroke-width="8"/><text x="356" y="109">purple: shared R3 branch</text>
  </g>
  <rect x="45" y="93" width="790" height="70" rx="10" fill="#e3f3fa" stroke="#1979a7" stroke-width="3"/>
  <circle cx="82" cy="128" r="19" fill="#1979a7"/><text x="82" y="136" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">3</text>
  <text x="120" y="136" font-family="Arial" font-size="24" fill="#15394b">Use right-angle bends. Keep wires outside parts and labels.</text>
</svg>
