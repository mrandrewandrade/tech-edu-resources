<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Set one resistor value</title>
  <desc id="desc">A simplified Tinkercad screen showing one selected resistor and its resistance value and unit controls.</desc>
  <rect width="1400" height="800" fill="#f4f6f8"/>
  <rect width="1400" height="72" fill="#fff" stroke="#cbd3dc"/>
  <text x="28" y="44" font-family="Arial, sans-serif" font-size="23" fill="#263746">TEJ Midterm Starter – Two Loops, Three Currents</text>
  <rect x="1110" y="15" width="180" height="42" rx="6" fill="#fff" stroke="#1c6b96" stroke-width="2"/>
  <text x="1142" y="43" font-family="Arial, sans-serif" font-size="20" fill="#173b50">Start Simulation</text>
  <g transform="translate(420 310)">
    <line x1="0" y1="70" x2="115" y2="70" stroke="#5e6870" stroke-width="8"/>
    <rect x="112" y="34" width="210" height="72" rx="18" fill="#d49a50" stroke="#815823" stroke-width="5"/>
    <rect x="145" y="36" width="18" height="68" fill="#d7bb32"/><rect x="182" y="36" width="18" height="68" fill="#6e2c91"/><rect x="220" y="36" width="18" height="68" fill="#c52e2e"/><rect x="272" y="36" width="12" height="68" fill="#d8b357"/>
    <line x1="322" y1="70" x2="440" y2="70" stroke="#5e6870" stroke-width="8"/>
    <rect x="-22" y="12" width="486" height="116" rx="16" fill="none" stroke="#1686c2" stroke-width="6" stroke-dasharray="14 10"/>
    <text x="170" y="170" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="700" fill="#263746">Selected resistor</text>
  </g>
  <g transform="translate(955 145)">
    <rect width="360" height="360" rx="12" fill="#ffffff" stroke="#96a7b4" stroke-width="3"/>
    <rect width="360" height="62" rx="12" fill="#178cc3"/><text x="22" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">Resistor</text>
    <text x="25" y="108" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#263746">Name</text>
    <rect x="145" y="78" width="180" height="45" rx="4" fill="#fff" stroke="#8697a2"/><text x="162" y="108" font-family="Arial" font-size="20" fill="#263746">R1</text>
    <text x="25" y="175" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#263746">Resistance</text>
    <rect x="145" y="145" width="102" height="48" rx="4" fill="#fff8c7" stroke="#d09a00" stroke-width="3"/><text x="170" y="177" font-family="Arial" font-size="22" font-weight="700" fill="#263746">2.2</text>
    <rect x="255" y="145" width="70" height="48" rx="4" fill="#fff8c7" stroke="#d09a00" stroke-width="3"/><text x="276" y="177" font-family="Arial" font-size="21" font-weight="700" fill="#263746">kΩ</text>
    <path d="M310 164 l8 0 l-4 7z" fill="#263746"/>
    <rect x="22" y="224" width="314" height="102" rx="8" fill="#e8f5fb" stroke="#1686c2" stroke-width="2"/>
    <text x="40" y="258" font-family="Arial" font-size="18" fill="#173b50">Type the number.</text>
    <text x="40" y="289" font-family="Arial" font-size="18" fill="#173b50">Then choose <tspan font-weight="700">kΩ</tspan>.</text>
  </g>
  <rect x="58" y="100" width="700" height="72" rx="10" fill="#e3f3fa" stroke="#1979a7" stroke-width="3"/>
  <circle cx="95" cy="136" r="19" fill="#1979a7"/><text x="95" y="144" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">2</text>
  <text x="132" y="144" font-family="Arial, sans-serif" font-size="24" fill="#15394b">Click a component before changing its value.</text>
  <text x="120" y="690" font-family="Arial, sans-serif" font-size="23" fill="#263746">Repeat for the other resistors and both power supplies. Do not start wiring yet.</text>
</svg>
