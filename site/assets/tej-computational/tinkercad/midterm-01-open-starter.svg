<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Open the Tinkercad starter</title>
  <desc id="desc">A simplified view of the live Tinkercad starter showing two supplies, three loose resistors, a multimeter, the Components panel, and Start Simulation.</desc>
  <rect width="1400" height="800" fill="#f4f6f8"/>
  <rect x="0" y="0" width="1400" height="74" fill="#ffffff" stroke="#cbd3dc"/>
  <rect x="22" y="16" width="420" height="42" rx="8" fill="#eef2f5"/>
  <text x="42" y="44" font-family="Arial, sans-serif" font-size="22" fill="#263746">TEJ Midterm Starter – Two Loops, Three Currents</text>
  <rect x="1060" y="17" width="175" height="40" rx="6" fill="#ffffff" stroke="#1c6b96" stroke-width="2"/>
  <polygon points="1080,29 1080,45 1094,37" fill="#1c6b96"/>
  <text x="1104" y="44" font-family="Arial, sans-serif" font-size="20" fill="#173b50">Start Simulation</text>
  <rect x="1248" y="74" width="152" height="726" fill="#e9eef2" stroke="#c6d0d8"/>
  <text x="1270" y="111" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263746">Components</text>
  <rect x="1263" y="130" width="122" height="42" rx="5" fill="#ffffff" stroke="#bac6cf"/>
  <text x="1281" y="158" font-family="Arial, sans-serif" font-size="18" fill="#687783">Search</text>
  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#263746">
    <rect x="1262" y="195" width="124" height="105" rx="8" fill="#ffffff" stroke="#cbd3dc"/>
    <line x1="1324" y1="216" x2="1324" y2="255" stroke="#a1682e" stroke-width="9"/>
    <text x="1324" y="286">Resistor</text>
    <rect x="1262" y="318" width="124" height="105" rx="8" fill="#ffffff" stroke="#cbd3dc"/>
    <rect x="1290" y="337" width="68" height="38" rx="5" fill="#f2b21a" stroke="#6d5421" stroke-width="3"/>
    <text x="1324" y="409">Multimeter</text>
  </g>
  <g transform="translate(90 360)">
    <rect width="260" height="205" rx="10" fill="#d7dadd" stroke="#8d979f" stroke-width="3"/>
    <rect x="20" y="24" width="142" height="68" fill="#dce9ec" stroke="#495158" stroke-width="7"/>
    <circle cx="207" cy="58" r="33" fill="#c6c7c7" stroke="#575d62" stroke-width="4"/>
    <rect x="20" y="108" width="142" height="56" fill="#dce9ec" stroke="#495158" stroke-width="7"/>
    <circle cx="205" cy="137" r="29" fill="#c6c7c7" stroke="#575d62" stroke-width="4"/>
    <circle cx="177" cy="183" r="10" fill="#d52b2b"/><circle cx="205" cy="183" r="10" fill="#30383f"/>
    <text x="12" y="-16" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#253746">Power supply 1</text>
  </g>
  <g transform="translate(820 360)">
    <rect width="260" height="205" rx="10" fill="#d7dadd" stroke="#8d979f" stroke-width="3"/>
    <rect x="20" y="24" width="142" height="68" fill="#dce9ec" stroke="#495158" stroke-width="7"/>
    <circle cx="207" cy="58" r="33" fill="#c6c7c7" stroke="#575d62" stroke-width="4"/>
    <rect x="20" y="108" width="142" height="56" fill="#dce9ec" stroke="#495158" stroke-width="7"/>
    <circle cx="205" cy="137" r="29" fill="#c6c7c7" stroke="#575d62" stroke-width="4"/>
    <circle cx="177" cy="183" r="10" fill="#d52b2b"/><circle cx="205" cy="183" r="10" fill="#30383f"/>
    <text x="12" y="-16" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#253746">Power supply 2</text>
  </g>
  <g stroke="#b67531" stroke-width="16" stroke-linecap="round">
    <line x1="520" y1="315" x2="570" y2="245"/><line x1="688" y1="245" x2="688" y2="315"/><line x1="620" y1="565" x2="620" y2="645"/>
  </g>
  <g stroke="#222" stroke-width="5"><line x1="530" y1="302" x2="560" y2="260"/><line x1="688" y1="260" x2="688" y2="300"/><line x1="620" y1="582" x2="620" y2="630"/></g>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#253746">
    <text x="515" y="220">R1</text><text x="675" y="220">R2</text><text x="640" y="620">R3</text>
  </g>
  <g transform="translate(932 620)">
    <rect width="250" height="110" rx="10" fill="#f7b525" stroke="#a97900" stroke-width="4"/>
    <rect x="22" y="20" width="175" height="65" fill="#dbe6e8" stroke="#4c565b" stroke-width="5"/>
    <text x="12" y="-15" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#253746">Multimeter</text>
  </g>
  <rect x="27" y="92" width="670" height="66" rx="10" fill="#e3f3fa" stroke="#1979a7" stroke-width="3"/>
  <circle cx="62" cy="125" r="18" fill="#1979a7"/><text x="62" y="132" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">1</text>
  <text x="95" y="133" font-family="Arial, sans-serif" font-size="24" fill="#15394b">Open the class activity and choose <tspan font-weight="700">Tinker this</tspan>.</text>
</svg>
