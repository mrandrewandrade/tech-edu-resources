<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 520" role="img" aria-labelledby="title desc">
  <title id="title">Simplified lamp circuit with a poor ground</title>
  <desc id="desc">A 12 volt source drives a lamp represented by 6.86 ohms in series with a one ohm poor-ground resistance. Voltage test points show where the unwanted ground voltage is measured.</desc>
  <defs><style>
    .wire{fill:none;stroke:#263238;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.pos{stroke:#a4202a}.box{fill:#fff;stroke:#263238;stroke-width:4}.fault{fill:#fff4e0;stroke:#9b6a00;stroke-width:5}.label{font:700 30px system-ui,sans-serif;fill:#172126}.body{font:25px system-ui,sans-serif;fill:#172126}.small{font:21px system-ui,sans-serif;fill:#37474f}.tp{fill:#fff;stroke:#5c3977;stroke-width:4}
  </style></defs>
  <text class="label" x="45" y="55">State A fault model · L1 poor ground</text>
  <text class="small" x="45" y="90">For this calculation only, model the hot 21 W lamp as R = V²/P = 6.86 Ω.</text>
  <circle class="box" cx="115" cy="250" r="55"/><text class="body" x="80" y="260">12 V</text>
  <path class="wire pos" d="M170 250H340"/><rect class="box" x="340" y="210" width="135" height="80" rx="10"/><text class="body" x="382" y="260">F1</text>
  <path class="wire pos" d="M475 250H620"/><circle class="tp" cx="585" cy="250" r="13"/><text class="small" x="550" y="205">TP+</text>
  <circle class="box" cx="740" cy="250" r="83"/><path class="wire" d="M685 195L795 305M795 195L685 305"/>
  <text class="body" x="690" y="365">L1 · 6.86 Ω</text>
  <path class="wire" d="M823 250H940"/><circle class="tp" cx="900" cy="250" r="13"/><text class="small" x="860" y="205">TPG</text>
  <rect class="fault" x="940" y="200" width="235" height="100" rx="14"/><text class="body" x="970" y="240">Poor ground</text><text class="label" x="1012" y="282">1.00 Ω</text>
  <path class="wire" d="M1175 250H1300V415H115V305"/>
  <path class="wire" d="M665 415H750M680 437H735M695 459H720"/>
  <text class="body" x="835" y="430">0 V battery return</text>
</svg>
