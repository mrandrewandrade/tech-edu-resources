<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1F2430; }
    .title { font-size: 34px; font-weight: 700; fill: #1E2B55; }
    .label { font-size: 25px; font-weight: 700; fill: #1E2B55; }
    .body { font-size: 23px; }
    .small { font-size: 20px; fill: #6B7280; }
    .wire { stroke: #1E2B55; stroke-width: 7; fill: none; stroke-linecap: square; stroke-linejoin: round; }
    .thin { stroke: #1E2B55; stroke-width: 4; fill: none; }
    .blue { stroke: #1769AA; fill: #1769AA; }
  </style>

    <text x="60" y="65" class="title">Capacitor symbols and polarity</text>
    <line x1="100" y1="270" x2="300" y2="270" class="wire"/>
    <line x1="300" y1="170" x2="300" y2="370" class="wire"/>
    <line x1="390" y1="170" x2="390" y2="370" class="wire"/>
    <line x1="390" y1="270" x2="590" y2="270" class="wire"/>
    <text x="190" y="445" class="label">non-polarized</text>
    <line x1="690" y1="270" x2="820" y2="270" class="wire"/>
    <line x1="820" y1="170" x2="820" y2="370" class="wire"/>
    <path d="M 915 170 Q 850 270 915 370" class="wire"/>
    <line x1="915" y1="270" x2="1090" y2="270" class="wire"/>
    <text x="780" y="135" font-size="42" font-weight="700" fill="#C62828">+</text>
    <text x="760" y="445" class="label">polarized</text>
    <text x="80" y="560" class="body">Ceramic capacitors are commonly non-polarized.</text>
    <text x="650" y="560" class="body">Electrolytic capacitors require correct polarity.</text>
    <text x="80" y="625" class="small">Always check the real part, the board marking, capacitance, and voltage rating before connecting power.</text>

</svg>
