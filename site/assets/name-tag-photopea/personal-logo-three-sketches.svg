<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Three different logo sketches</title>
  <desc id="desc">Three cards compare initials only, landscape shapes only, and initials with one landscape shape. The third is selected for development.</desc>
  <rect width="1200" height="500" rx="30" fill="#eef4f7"/>
  <style>.title{font:700 27px 'Source Sans 3',Arial,sans-serif;fill:#0b2e4f}.label{font:700 23px 'Source Sans 3',Arial,sans-serif;fill:#0b2e4f}.note{font:500 18px 'Source Sans 3',Arial,sans-serif;fill:#405568}.card{fill:#fff;stroke:#9fb2c1;stroke-width:3}.selected{fill:#fff;stroke:#22a6cc;stroke-width:7}.ink{fill:none;stroke:#17212a;stroke-width:16;stroke-linecap:round;stroke-linejoin:round}</style>
  <text class="title" x="48" y="50">Change the idea, not only the size</text>
  <g transform="translate(45 82)"><rect class="card" width="340" height="350" rx="18"/><text class="label" x="24" y="40">A. INITIALS ONLY</text><path class="ink" d="M78 262 148 105l70 157M105 200h87M184 262l65-157 62 157M215 200h65"/><text class="note" x="24" y="320">Clear letters, less personal meaning.</text></g>
  <g transform="translate(430 82)"><rect class="card" width="340" height="350" rx="18"/><text class="label" x="24" y="40">B. SHAPES ONLY</text><circle cx="110" cy="138" r="38" fill="#111820"/><path d="M72 267 179 92l115 175z" fill="#111820"/><path d="M45 292Q155 230 296 286" fill="none" stroke="#111820" stroke-width="22" stroke-linecap="round"/><text class="note" x="24" y="320">Strong silhouette, no initials.</text></g>
  <g transform="translate(815 82)"><rect class="selected" width="340" height="350" rx="18"/><text class="label" x="24" y="40">C. INITIALS + SHAPE</text><path class="ink" d="M65 263 132 108l67 155M91 203h83M161 263l66-155 65 155M191 203h72"/><path d="M110 132 168 61l60 71" fill="none" stroke="#2f6f52" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="303" cy="29" r="20" fill="#22a6cc"/><path d="m294 29 7 7 13-16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="note" x="24" y="310">SELECTED: recognizable and personal.</text><text class="note" x="24" y="334">The mountain becomes part of the letters.</text></g>
</svg>
