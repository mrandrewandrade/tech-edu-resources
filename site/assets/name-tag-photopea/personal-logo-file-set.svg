<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Logo project file set</title><desc id="desc">Three file cards show a layered PSD working file, a scalable SVG master, and a transparent PNG for the name tag.</desc>
  <rect width="1200" height="410" rx="30" fill="#eef4f7"/><style>.title{font:700 27px 'Source Sans 3',Arial,sans-serif;fill:#0b2e4f}.ext{font:800 42px 'Source Sans 3',Arial,sans-serif;fill:#fff}.label{font:700 23px 'Source Sans 3',Arial,sans-serif;fill:#0b2e4f}.note{font:500 18px 'Source Sans 3',Arial,sans-serif;fill:#405568}.card{fill:#fff;stroke:#9fb2c1;stroke-width:3}</style><text class="title" x="48" y="50">Save the editable source and both delivery formats</text>
  <g transform="translate(45 82)"><rect class="card" width="340" height="275" rx="18"/><rect x="28" y="42" width="88" height="88" rx="14" fill="#245ca6"/><text class="ext" x="72" y="100" text-anchor="middle">PSD</text><text class="label" x="140" y="70">EDITABLE SOURCE</text><rect x="142" y="94" width="148" height="17" rx="5" fill="#b9d2e6"/><rect x="142" y="120" width="124" height="17" rx="5" fill="#79a8ca"/><rect x="142" y="146" width="162" height="17" rx="5" fill="#3b739c"/><text class="note" x="28" y="211">Named layers and editable text</text><text class="note" x="28" y="239">Revise this file later</text></g>
  <g transform="translate(430 82)"><rect class="card" width="340" height="275" rx="18"/><rect x="28" y="42" width="88" height="88" rx="14" fill="#e68a24"/><text class="ext" x="72" y="100" text-anchor="middle">SVG</text><text class="label" x="140" y="70">VECTOR MASTER</text><circle cx="197" cy="126" r="43" fill="none" stroke="#0b2e4f" stroke-width="8"/><path d="M154 153 196 87l50 66" fill="none" stroke="#2f6f52" stroke-width="10" stroke-linejoin="round"/><text class="note" x="28" y="211">Scales without pixelation</text><text class="note" x="28" y="239">Best master for reuse</text></g>
  <g transform="translate(815 82)"><rect class="card" width="340" height="275" rx="18"/><rect x="28" y="42" width="88" height="88" rx="14" fill="#2f6f52"/><text class="ext" x="72" y="100" text-anchor="middle">PNG</text><text class="label" x="140" y="70">NAME-TAG COPY</text><path d="M143 92h159v79H143z" fill="#fff"/><path d="M143 92h40v40h-40zm80 0h40v40h-40zm-40 40h40v39h-40zm80 0h39v39h-39z" fill="#dbe2e7"/><circle cx="222" cy="128" r="43" fill="#0b2e4f" opacity=".88"/><text class="note" x="28" y="211">Transparent raster export</text><text class="note" x="28" y="239">Place on the 11 × 4 inch tag</text></g>
</svg>
