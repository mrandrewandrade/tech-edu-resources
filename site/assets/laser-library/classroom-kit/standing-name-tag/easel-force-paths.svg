<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" role="img" aria-labelledby="title desc">
  <title id="title">How an A-frame easel carries load</title>
  <desc id="desc">Large, stacked front and side diagrams show the splayed front legs, cross rail, ledge, rear kickstand, centre of mass, support footprint, weight and ground reactions.</desc>
  <defs>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#b8322a"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#167454"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#256a8a"/></marker>
    <style>.heading{font:700 34px Arial,sans-serif;fill:#172a34}.label{font:700 25px Arial,sans-serif;fill:#172a34}.note{font:22px Arial,sans-serif;fill:#172a34}.pill{fill:#fff;stroke:#cbd5da;stroke-width:2}</style>
  </defs>
  <rect width="1000" height="940" fill="#fff"/>
  <text x="500" y="48" text-anchor="middle" class="heading">Front view: wide legs resist sideways tipping</text>
  <g id="front-view" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M472 100 L285 385" stroke="#234d62" stroke-width="38"/><path d="M528 100 L715 385" stroke="#234d62" stroke-width="38"/><path d="M500 92 L500 245" stroke="#234d62" stroke-width="40"/>
    <path d="M360 222 H640" stroke="#d27a1f" stroke-width="34"/><path d="M380 300 H620" stroke="#6d4a96" stroke-width="28"/>
    <line x1="500" y1="76" x2="500" y2="160" stroke="#b8322a" stroke-width="6" marker-end="url(#arrow-red)"/>
    <line x1="285" y1="430" x2="285" y2="388" stroke="#167454" stroke-width="6" marker-end="url(#arrow-green)"/><line x1="715" y1="430" x2="715" y2="388" stroke="#167454" stroke-width="6" marker-end="url(#arrow-green)"/>
    <line x1="285" y1="418" x2="715" y2="418" stroke="#256a8a" stroke-width="5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  </g>
  <g>
    <rect class="pill" x="535" y="88" width="245" height="43" rx="10"/><text x="553" y="118" class="label">display weight</text>
    <rect class="pill" x="383" y="179" width="234" height="43" rx="10"/><text x="500" y="209" text-anchor="middle" class="label">cross rail</text>
    <rect class="pill" x="416" y="267" width="168" height="43" rx="10"/><text x="500" y="297" text-anchor="middle" class="label">ledge</text>
    <text x="500" y="458" text-anchor="middle" class="label">wide front footprint</text>
    <text x="95" y="345" class="label">splayed leg</text><text x="742" y="345" class="label">splayed leg</text>
    <text x="500" y="491" text-anchor="middle" class="note">Load travels mostly down the sheet, where plywood is stiffest.</text>
  </g>
  <line x1="60" y1="520" x2="940" y2="520" stroke="#cbd5da" stroke-width="3"/>
  <text x="500" y="568" text-anchor="middle" class="heading">Side view: three contacts make a stable triangle</text>
  <g id="side-view" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="150" y1="858" x2="870" y2="858" stroke="#7d8b92" stroke-width="4"/>
    <path d="M470 612 L350 846" stroke="#234d62" stroke-width="40"/><path d="M474 620 L750 846" stroke="#d27a1f" stroke-width="36"/>
    <circle cx="473" cy="621" r="19" fill="#fff" stroke="#172a34" stroke-width="7"/><path d="M397 645 L520 680 L455 810 L335 775 Z" fill="#d9e8ef" stroke="#256a8a" stroke-width="6"/>
    <line x1="446" y1="694" x2="446" y2="792" stroke="#b8322a" stroke-width="6" marker-end="url(#arrow-red)"/>
    <line x1="350" y1="910" x2="350" y2="850" stroke="#167454" stroke-width="6" marker-end="url(#arrow-green)"/><line x1="750" y1="910" x2="750" y2="850" stroke="#167454" stroke-width="6" marker-end="url(#arrow-green)"/>
    <line x1="350" y1="888" x2="750" y2="888" stroke="#256a8a" stroke-width="5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/><line x1="446" y1="804" x2="446" y2="858" stroke="#b8322a" stroke-width="4" stroke-dasharray="10 8"/>
  </g>
  <g>
    <rect class="pill" x="500" y="584" width="115" height="43" rx="10"/><text x="558" y="614" text-anchor="middle" class="label">pivot</text>
    <rect class="pill" x="680" y="686" width="255" height="72" rx="10"/><text x="700" y="717" class="label">rear kickstand</text><text x="700" y="746" class="note">mostly compression</text>
    <rect class="pill" x="180" y="690" width="250" height="43" rx="10"/><text x="305" y="720" text-anchor="middle" class="label">centre of mass</text>
    <text x="550" y="927" text-anchor="middle" class="label">front-to-back support footprint</text>
    <text x="175" y="838" class="label">front contact</text><text x="762" y="838" class="label">rear contact</text>
  </g>
</svg>
