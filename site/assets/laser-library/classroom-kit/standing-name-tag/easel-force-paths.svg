<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">How an A-frame easel carries load</title>
  <desc id="desc">Front and side diagrams show the two splayed front legs, cross rail, rear kickstand, support footprint, weight force and ground reactions.</desc>
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b8322a"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#167454"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#256a8a"/>
    </marker>
  </defs>

  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="250" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172a34">Front view</text>
  <text x="750" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172a34">Side view</text>

  <g id="front-view" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M236 88 L132 420" stroke="#234d62" stroke-width="26"/>
    <path d="M264 88 L368 420" stroke="#234d62" stroke-width="26"/>
    <path d="M250 82 L250 254" stroke="#234d62" stroke-width="28"/>
    <path d="M165 242 H335" stroke="#d27a1f" stroke-width="24"/>
    <path d="M178 318 H322" stroke="#6d4a96" stroke-width="18"/>
    <line x1="250" y1="55" x2="250" y2="145" stroke="#b8322a" stroke-width="4" marker-end="url(#arrow-red)"/>
    <line x1="132" y1="468" x2="132" y2="422" stroke="#167454" stroke-width="4" marker-end="url(#arrow-green)"/>
    <line x1="368" y1="468" x2="368" y2="422" stroke="#167454" stroke-width="4" marker-end="url(#arrow-green)"/>
    <line x1="132" y1="452" x2="368" y2="452" stroke="#256a8a" stroke-width="3" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#172a34">
    <text x="270" y="76" font-size="17" font-weight="700">display weight</text>
    <text x="250" y="232" text-anchor="middle" font-size="17" font-weight="700">cross rail</text>
    <text x="250" y="309" text-anchor="middle" font-size="17" font-weight="700">ledge</text>
    <text x="250" y="492" text-anchor="middle" font-size="17" font-weight="700">wide front footprint</text>
    <text x="72" y="385" font-size="15">splayed leg</text>
    <text x="383" y="385" font-size="15">splayed leg</text>
  </g>

  <g id="side-view" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="565" y1="430" x2="905" y2="430" stroke="#7d8b92" stroke-width="3"/>
    <path d="M685 92 L620 420" stroke="#234d62" stroke-width="27"/>
    <path d="M688 102 L850 420" stroke="#d27a1f" stroke-width="24"/>
    <circle cx="687" cy="105" r="14" fill="#ffffff" stroke="#172a34" stroke-width="5"/>
    <path d="M640 122 L723 148 L685 315 L606 290 Z" fill="#d9e8ef" stroke="#256a8a" stroke-width="4"/>
    <line x1="680" y1="180" x2="680" y2="292" stroke="#b8322a" stroke-width="4" marker-end="url(#arrow-red)"/>
    <line x1="620" y1="474" x2="620" y2="424" stroke="#167454" stroke-width="4" marker-end="url(#arrow-green)"/>
    <line x1="850" y1="474" x2="850" y2="424" stroke="#167454" stroke-width="4" marker-end="url(#arrow-green)"/>
    <line x1="620" y1="452" x2="850" y2="452" stroke="#256a8a" stroke-width="3" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
    <line x1="680" y1="318" x2="680" y2="430" stroke="#b8322a" stroke-width="2" stroke-dasharray="7 6"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#172a34">
    <text x="706" y="95" font-size="17" font-weight="700">pivot</text>
    <text x="855" y="355" font-size="17" font-weight="700">rear kickstand</text>
    <text x="855" y="377" font-size="14">mostly compression</text>
    <text x="696" y="235" font-size="17" font-weight="700">centre of mass</text>
    <text x="735" y="492" text-anchor="middle" font-size="17" font-weight="700">front-to-back support footprint</text>
    <text x="565" y="405" font-size="14">front contact</text>
    <text x="850" y="405" text-anchor="middle" font-size="14">rear contact</text>
  </g>

  <line x1="500" y1="60" x2="500" y2="485" stroke="#cbd5da" stroke-width="2"/>
</svg>
