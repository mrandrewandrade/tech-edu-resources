<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">BeagleBone low-side relay driver</title>
  <desc id="desc">A verified 3.3 volt GPIO controls a logic-compatible transistor or MOSFET through a calculated gate resistor. A pull-down holds the driver off. A separate 12 volt supply powers the relay coil, and a flyback diode is across the coil. The relay contacts switch a separately fused lamp or teacher-supervised horn.</desc>
  <defs><style>.t{font:700 38px Arial,sans-serif;fill:#111}.l{font:29px Arial,sans-serif;fill:#111}.n{font:700 28px Arial,sans-serif;fill:#111}.s{stroke:#111;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}.b{fill:#fff;stroke:#111;stroke-width:4}.d{stroke:#666;stroke-width:5;stroke-dasharray:14 12;fill:none}</style></defs>
  <rect width="1500" height="760" fill="white"/><text x="750" y="50" text-anchor="middle" class="t">BEAGLEBONE RELAY DRIVER — GPIO IS A SIGNAL, NOT A COIL SUPPLY</text>
  <rect x="45" y="105" width="450" height="555" rx="20" class="b"/><text x="270" y="155" text-anchor="middle" class="t">3.3 V LOGIC</text><rect x="105" y="230" width="250" height="120" rx="15" class="b"/><text x="230" y="280" text-anchor="middle" class="n">BeagleBone</text><text x="230" y="315" text-anchor="middle" class="l">verified GPIO</text>
  <line x1="355" y1="290" x2="420" y2="290" class="s"/><path d="M420 290 l25-25 l25 50 l25-50 l25 50 l25-25" class="s"/><text x="480" y="245" text-anchor="middle" class="l">Rgate (calculate)</text>
  <rect x="560" y="190" width="520" height="470" rx="20" class="b"/><text x="820" y="240" text-anchor="middle" class="t">12 V COIL DRIVER</text>
  <line x1="545" y1="290" x2="655" y2="290" class="s"/><rect x="655" y="265" width="130" height="110" class="b"/><text x="720" y="310" text-anchor="middle" class="n">logic-level</text><text x="720" y="342" text-anchor="middle" class="n">MOSFET</text>
  <line x1="610" y1="290" x2="610" y2="430" class="s"/><path d="M610 430 l-25 25 l50 25 l-50 25 l25 25" class="s"/><text x="555" y="490" text-anchor="end" class="l">Rpull-down</text><line x1="610" y1="530" x2="610" y2="585" class="s"/>
  <line x1="720" y1="375" x2="720" y2="585" class="s"/><line x1="200" y1="410" x2="200" y2="585" class="s"/><line x1="180" y1="585" x2="940" y2="585" class="s"/><text x="380" y="625" text-anchor="middle" class="l">shared 0 V only when the approved design requires it</text>
  <line x1="720" y1="265" x2="720" y2="185" class="s"/><path d="M720 185 q25-55 50 0 q25 55 50 0 q25-55 50 0 q25 55 50 0" class="s"/><text x="820" y="135" text-anchor="middle" class="n">relay coil 85–86</text><line x1="920" y1="185" x2="920" y2="100" class="s"/><text x="920" y="85" text-anchor="middle" class="n">+12 V COIL</text>
  <line x1="720" y1="215" x2="920" y2="215" class="s"/><rect x="790" y="185" width="90" height="60" class="b"/><line x1="860" y1="185" x2="860" y2="245" class="s"/><text x="835" y="225" text-anchor="middle" class="n">D1</text><text x="820" y="275" text-anchor="middle" class="l">cathode stripe toward +12 V</text>
  <line x1="930" y1="350" x2="1150" y2="350" class="d"/><text x="1040" y="330" text-anchor="middle" class="l">mechanical link</text>
  <rect x="1120" y="105" width="335" height="555" rx="20" class="b"/><text x="1288" y="155" text-anchor="middle" class="t">FUSED LOAD</text><text x="1288" y="205" text-anchor="middle" class="n">+12 V LOAD</text><rect x="1250" y="235" width="76" height="50" class="b"/><text x="1288" y="270" text-anchor="middle" class="n">FUSE</text><line x1="1288" y1="205" x2="1288" y2="235" class="s"/><line x1="1288" y1="285" x2="1288" y2="350" class="s"/><circle cx="1288" cy="350" r="9" fill="#111"/><text x="1240" y="360" class="n">30</text><circle cx="1288" cy="445" r="9" fill="#111"/><text x="1240" y="455" class="n">87</text><line x1="1288" y1="350" x2="1288" y2="425" class="s"/><line x1="1288" y1="445" x2="1288" y2="485" class="s"/><rect x="1195" y="485" width="186" height="70" rx="12" class="b"/><text x="1288" y="528" text-anchor="middle" class="n">lamp / horn*</text><line x1="1288" y1="555" x2="1288" y2="585" class="s"/><text x="1288" y="625" text-anchor="middle" class="l">0 V load</text><text x="1288" y="650" text-anchor="middle" class="l">*horn: teacher station only</text>
</svg>

