<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Capacitor charge and discharge circuits shown as two separate switch states</title>
  <desc id="desc">The left panel shows a protected five volt supply charging a polarized capacitor through a charging resistor. The right panel shows the source disconnected and the capacitor discharging through a current limiting resistor and LED or low-current active buzzer. A bleeder resistor is across the capacitor.</desc>
  <defs><style>.t{font:700 38px Arial,sans-serif;fill:#111}.l{font:30px Arial,sans-serif;fill:#111}.n{font:700 28px Arial,sans-serif;fill:#111}.s{stroke:#111;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}.b{fill:#fff;stroke:#111;stroke-width:4}.d{stroke:#666;stroke-width:4;stroke-dasharray:13 10;fill:none}</style></defs>
  <rect width="1500" height="760" fill="white"/><text x="750" y="50" text-anchor="middle" class="t">CAPACITOR INVESTIGATION — DRAW EACH SWITCH STATE SEPARATELY</text>
  <rect x="45" y="90" width="675" height="590" rx="20" class="b"/><rect x="780" y="90" width="675" height="590" rx="20" class="b"/>
  <text x="382" y="145" text-anchor="middle" class="t">STATE 1: CHARGE</text><text x="1118" y="145" text-anchor="middle" class="t">STATE 2: DISCHARGE</text>
  <text x="115" y="220" class="n">protected +5 V</text><line x1="150" y1="240" x2="150" y2="330" class="s"/><path d="M150 330 l25-25 l25 50 l25-50 l25 50 l25-25" class="s"/><text x="215" y="285" text-anchor="middle" class="l">Rcharge</text><line x1="275" y1="330" x2="470" y2="330" class="s"/><circle cx="470" cy="330" r="9" fill="#111"/><text x="470" y="300" text-anchor="middle" class="n">VC+</text>
  <line x1="470" y1="330" x2="470" y2="415" class="s"/><line x1="425" y1="415" x2="515" y2="415" class="s"/><line x1="435" y1="455" x2="505" y2="455" class="s"/><text x="530" y="435" class="n">C +</text><line x1="470" y1="455" x2="470" y2="560" class="s"/>
  <line x1="150" y1="560" x2="600" y2="560" class="s"/><text x="150" y="605" text-anchor="middle" class="l">0 V</text><path d="M600 330 l25 25 l-50 25 l50 25 l-50 25 l25 25" class="s"/><text x="640" y="410" class="l">bleeder</text><line x1="600" y1="455" x2="600" y2="560" class="s"/><line x1="470" y1="330" x2="600" y2="330" class="s"/>
  <text x="382" y="650" text-anchor="middle" class="l">KVL while charging: VS = VRcharge + VC</text>
  <text x="845" y="220" class="n">SOURCE DISCONNECTED</text><line x1="860" y1="250" x2="960" y2="250" class="d"/>
  <line x1="940" y1="330" x2="940" y2="415" class="s"/><line x1="895" y1="415" x2="985" y2="415" class="s"/><line x1="905" y1="455" x2="975" y2="455" class="s"/><text x="1000" y="435" class="n">C +</text><line x1="940" y1="455" x2="940" y2="560" class="s"/><circle cx="940" cy="330" r="9" fill="#111"/><text x="940" y="300" text-anchor="middle" class="n">VC+</text>
  <line x1="940" y1="330" x2="1080" y2="330" class="s"/><path d="M1080 330 l25-25 l25 50 l25-50 l25 50 l25-25" class="s"/><text x="1142" y="285" text-anchor="middle" class="l">Rlimit</text><line x1="1205" y1="330" x2="1300" y2="330" class="s"/><rect x="1240" y="370" width="140" height="90" rx="15" class="b"/><text x="1310" y="405" text-anchor="middle" class="n">LED or</text><text x="1310" y="438" text-anchor="middle" class="n">active buzzer</text><line x1="1300" y1="330" x2="1300" y2="370" class="s"/><line x1="1310" y1="460" x2="1310" y2="560" class="s"/><line x1="900" y1="560" x2="1370" y2="560" class="s"/>
  <path d="M1060 330 l25 25 l-50 25 l50 25 l-50 25 l25 25" class="s"/><text x="1085" y="500" class="l">bleeder</text><line x1="1060" y1="455" x2="1060" y2="560" class="s"/>
  <text x="1118" y="650" text-anchor="middle" class="l">KVL while discharging: VC = VRlimit + Vload</text>
</svg>

