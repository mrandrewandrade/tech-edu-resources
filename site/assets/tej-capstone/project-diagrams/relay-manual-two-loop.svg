<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Manual automotive relay trainer with separate control and load loops</title>
  <desc id="desc">The left control loop powers relay coil terminals 86 and 85 through a switch. The right load loop powers a lamp through a fuse, terminal 30, and normally open terminal 87. A dashed line shows mechanical coupling only.</desc>
  <defs><style>.t{font:700 38px Arial,sans-serif;fill:#111}.l{font:30px Arial,sans-serif;fill:#111}.n{font:700 29px Arial,sans-serif;fill:#111}.s{stroke:#111;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}.b{fill:#fff;stroke:#111;stroke-width:4}.d{stroke:#666;stroke-width:5;stroke-dasharray:14 12;fill:none}.tp{fill:#fff;stroke:#111;stroke-width:4}</style></defs>
  <rect width="1500" height="760" fill="white"/>
  <text x="750" y="50" text-anchor="middle" class="t">MANUAL RELAY TRAINER — TWO ELECTRICALLY SEPARATE LOOPS</text>
  <rect x="45" y="90" width="650" height="590" rx="20" class="b"/><rect x="805" y="90" width="650" height="590" rx="20" class="b"/>
  <text x="370" y="140" text-anchor="middle" class="t">CONTROL / COIL LOOP</text><text x="1130" y="140" text-anchor="middle" class="t">CONTACT / LAMP LOOP</text>
  <text x="105" y="220" class="n">+12 V CONTROL</text><line x1="135" y1="240" x2="135" y2="310" class="s"/>
  <rect x="105" y="310" width="60" height="90" class="b"/><text x="180" y="365" class="l">control protection</text>
  <line x1="135" y1="400" x2="135" y2="465" class="s"/><circle cx="135" cy="465" r="9" fill="#111"/><circle cx="265" cy="465" r="9" fill="#111"/><line x1="135" y1="465" x2="245" y2="420" class="s"/><text x="200" y="405" text-anchor="middle" class="l">switch</text>
  <line x1="265" y1="465" x2="350" y2="465" class="s"/><text x="330" y="445" class="n">86</text>
  <path d="M350 465 q25-55 50 0 q25 55 50 0 q25-55 50 0 q25 55 50 0" class="s"/><text x="450" y="545" text-anchor="middle" class="l">relay coil</text><text x="565" y="445" class="n">85</text>
  <line x1="550" y1="465" x2="620" y2="465" class="s"/><line x1="620" y1="465" x2="620" y2="600" class="s"/><line x1="590" y1="600" x2="650" y2="600" class="s"/><line x1="600" y1="620" x2="640" y2="620" class="s"/><line x1="610" y1="640" x2="630" y2="640" class="s"/><text x="620" y="675" text-anchor="middle" class="l">0 V control</text>
  <line x1="550" y1="425" x2="350" y2="425" class="s"/><rect x="430" y="400" width="80" height="50" class="b"/><line x1="490" y1="400" x2="490" y2="450" class="s"/><text x="470" y="390" text-anchor="middle" class="l">D1 clamp; cathode toward 86/+</text>
  <text x="860" y="220" class="n">+12 V LOAD</text><line x1="890" y1="240" x2="890" y2="300" class="s"/>
  <rect x="850" y="300" width="80" height="55" class="b"/><text x="890" y="338" text-anchor="middle" class="n">FUSE</text><line x1="890" y1="355" x2="890" y2="430" class="s"/>
  <circle cx="890" cy="430" r="9" fill="#111"/><text x="850" y="440" text-anchor="end" class="n">30</text><circle cx="1080" cy="360" r="9" fill="#111"/><text x="1080" y="335" text-anchor="middle" class="n">87</text><line x1="890" y1="430" x2="1050" y2="380" class="s"/>
  <line x1="1080" y1="360" x2="1080" y2="450" class="s"/><circle cx="1080" cy="500" r="45" class="b"/><path d="M1050 530 l60-60 M1050 470 l60 60" class="s"/><text x="1140" y="510" class="l">12 V lamp</text>
  <line x1="1080" y1="545" x2="1080" y2="600" class="s"/><line x1="1050" y1="600" x2="1110" y2="600" class="s"/><line x1="1060" y1="620" x2="1100" y2="620" class="s"/><line x1="1070" y1="640" x2="1090" y2="640" class="s"/><text x="1080" y="675" text-anchor="middle" class="l">0 V load</text>
  <line x1="555" y1="490" x2="875" y2="420" class="d"/><text x="715" y="430" text-anchor="middle" class="l">mechanical link — no electrical connection</text>
  <circle cx="890" cy="390" r="19" class="tp"/><text x="890" y="398" text-anchor="middle" class="n">2</text><circle cx="1080" cy="405" r="19" class="tp"/><text x="1080" y="413" text-anchor="middle" class="n">3</text><text x="1180" y="250" class="l">Measure voltages to the correct 0 V reference.</text>
</svg>

