<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
  <title id="title">Capacitor timing control for a relay-switched horn</title>
  <desc id="desc">The upper low-energy control path uses an RC timing voltage, threshold stage, and protected relay driver. The lower high-current path uses a separate fused twelve volt supply through relay contacts 30 and 87 to a teacher-supervised horn. The capacitor does not supply horn current.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#111"/></marker><style>.t{font:700 38px Arial,sans-serif;fill:#111}.l{font:29px Arial,sans-serif;fill:#111}.n{font:700 28px Arial,sans-serif;fill:#111}.s{stroke:#111;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}.a{stroke:#111;stroke-width:6;fill:none;marker-end:url(#a)}.b{fill:#fff;stroke:#111;stroke-width:4}.d{stroke:#666;stroke-width:5;stroke-dasharray:14 12;fill:none}</style></defs>
  <rect width="1500" height="780" fill="white"/><text x="750" y="50" text-anchor="middle" class="t">CAPACITOR CONTROLS WHEN — SEPARATE SUPPLY POWERS THE HORN</text>
  <rect x="55" y="95" width="1390" height="260" rx="22" class="b"/><text x="90" y="140" class="t">LOW-ENERGY TIMING / CONTROL PATH</text>
  <rect x="110" y="190" width="240" height="100" rx="15" class="b"/><text x="230" y="232" text-anchor="middle" class="n">RC timing node</text><text x="230" y="266" text-anchor="middle" class="l">changing VC(t)</text>
  <line x1="350" y1="240" x2="480" y2="240" class="a"/><rect x="490" y="190" width="260" height="100" rx="15" class="b"/><text x="620" y="232" text-anchor="middle" class="n">threshold stage</text><text x="620" y="266" text-anchor="middle" class="l">comparator / timer</text>
  <line x1="750" y1="240" x2="880" y2="240" class="a"/><rect x="890" y="190" width="250" height="100" rx="15" class="b"/><text x="1015" y="232" text-anchor="middle" class="n">relay driver</text><text x="1015" y="266" text-anchor="middle" class="l">transistor + clamp</text>
  <line x1="1140" y1="240" x2="1260" y2="240" class="a"/><rect x="1270" y="190" width="120" height="100" rx="15" class="b"/><text x="1330" y="232" text-anchor="middle" class="n">coil</text><text x="1330" y="266" text-anchor="middle" class="l">85–86</text>
  <line x1="1330" y1="290" x2="1330" y2="420" class="d"/><text x="1240" y="390" class="l">mechanical link only</text>
  <rect x="55" y="420" width="1390" height="285" rx="22" class="b"/><text x="90" y="470" class="t">HIGH-CURRENT LOAD PATH — TEACHER DEMONSTRATION ONLY</text>
  <text x="110" y="560" class="n">separate +12 V</text><line x1="300" y1="550" x2="390" y2="550" class="s"/><rect x="390" y="515" width="120" height="70" class="b"/><text x="450" y="558" text-anchor="middle" class="n">FUSE</text><line x1="510" y1="550" x2="650" y2="550" class="s"/><circle cx="650" cy="550" r="9" fill="#111"/><text x="650" y="520" text-anchor="middle" class="n">30</text><circle cx="820" cy="550" r="9" fill="#111"/><text x="820" y="520" text-anchor="middle" class="n">87</text><line x1="650" y1="550" x2="800" y2="505" class="s"/><line x1="820" y1="550" x2="930" y2="550" class="s"/>
  <rect x="930" y="500" width="260" height="100" rx="18" class="b"/><text x="1060" y="542" text-anchor="middle" class="n">mounted horn</text><text x="1060" y="576" text-anchor="middle" class="l">or lamp alternative</text><line x1="1190" y1="550" x2="1320" y2="550" class="s"/><text x="1320" y="530" text-anchor="middle" class="n">0 V load</text>
  <text x="750" y="745" text-anchor="middle" class="t">NO DIRECT ELECTRICAL PATH FROM THE TIMING CAPACITOR TO THE HORN</text>
</svg>

