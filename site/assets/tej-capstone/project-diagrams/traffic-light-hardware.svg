<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">
  <title id="title">BeagleBone traffic light LED and pedestrian button wiring</title>
  <desc id="desc">Three verified 3.3 volt GPIO outputs each drive one resistor and one LED to ground. A separate verified GPIO input has a ten kilo-ohm pull-down resistor and a normally open button to 3.3 volts. Exact header pins must be assigned after board verification.</desc>
  <defs><style>.t{font:700 38px Arial,sans-serif;fill:#111}.l{font:29px Arial,sans-serif;fill:#111}.n{font:700 28px Arial,sans-serif;fill:#111}.s{stroke:#111;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}.b{fill:#fff;stroke:#111;stroke-width:4}.dot{fill:#fff;stroke:#111;stroke-width:6}</style></defs>
  <rect width="1500" height="800" fill="white"/><text x="750" y="50" text-anchor="middle" class="t">TRAFFIC-LIGHT HARDWARE — VERIFY EACH HEADER PIN BEFORE WIRING</text>
  <rect x="55" y="110" width="390" height="590" rx="25" class="b"/><text x="250" y="165" text-anchor="middle" class="t">BeagleBone</text><text x="250" y="205" text-anchor="middle" class="l">3.3 V digital GPIO only</text>
  <text x="390" y="285" text-anchor="end" class="n">RED GPIO</text><circle cx="430" cy="278" r="9" fill="#111"/><text x="390" y="405" text-anchor="end" class="n">YELLOW GPIO</text><circle cx="430" cy="398" r="9" fill="#111"/><text x="390" y="525" text-anchor="end" class="n">GREEN GPIO</text><circle cx="430" cy="518" r="9" fill="#111"/><text x="390" y="645" text-anchor="end" class="n">BUTTON GPIO</text><circle cx="430" cy="638" r="9" fill="#111"/>
  <line x1="439" y1="278" x2="540" y2="278" class="s"/><path d="M540 278 l25-25 l25 50 l25-50 l25 50 l25-25" class="s"/><text x="605" y="235" text-anchor="middle" class="l">one calculated R</text><line x1="665" y1="278" x2="760" y2="278" class="s"/><circle cx="805" cy="278" r="45" class="dot"/><text x="805" y="287" text-anchor="middle" class="n">RED</text>
  <line x1="439" y1="398" x2="540" y2="398" class="s"/><path d="M540 398 l25-25 l25 50 l25-50 l25 50 l25-25" class="s"/><text x="605" y="355" text-anchor="middle" class="l">one calculated R</text><line x1="665" y1="398" x2="760" y2="398" class="s"/><circle cx="805" cy="398" r="45" class="dot"/><text x="805" y="407" text-anchor="middle" class="n">YEL</text>
  <line x1="439" y1="518" x2="540" y2="518" class="s"/><path d="M540 518 l25-25 l25 50 l25-50 l25 50 l25-25" class="s"/><text x="605" y="475" text-anchor="middle" class="l">one calculated R</text><line x1="665" y1="518" x2="760" y2="518" class="s"/><circle cx="805" cy="518" r="45" class="dot"/><text x="805" y="527" text-anchor="middle" class="n">GRN</text>
  <line x1="805" y1="323" x2="805" y2="580" class="s"/><line x1="805" y1="443" x2="805" y2="580" class="s"/><line x1="805" y1="563" x2="805" y2="580" class="s"/><line x1="775" y1="580" x2="835" y2="580" class="s"/><line x1="785" y1="600" x2="825" y2="600" class="s"/><line x1="795" y1="620" x2="815" y2="620" class="s"/><text x="805" y="660" text-anchor="middle" class="l">BeagleBone ground</text>
  <path d="M439 638 V705 H1040 V638" class="s"/><circle cx="1040" cy="638" r="10" fill="#111"/><path d="M1040 638 l25-25 l25 50 l25-50 l25 50 l25-25" class="s"/><text x="1120" y="595" text-anchor="middle" class="l">10 kΩ pull-down</text><line x1="1165" y1="638" x2="1165" y2="700" class="s"/><line x1="1135" y1="700" x2="1195" y2="700" class="s"/><line x1="1145" y1="720" x2="1185" y2="720" class="s"/><line x1="1155" y1="740" x2="1175" y2="740" class="s"/>
  <line x1="1040" y1="638" x2="1040" y2="430" class="s"/><circle cx="1040" cy="430" r="9" fill="#111"/><circle cx="1040" cy="330" r="9" fill="#111"/><line x1="1040" y1="430" x2="1100" y2="350" class="s"/><text x="1145" y="390" class="l">normally open button</text><line x1="1040" y1="330" x2="1040" y2="240" class="s"/><text x="1040" y="205" text-anchor="middle" class="n">3.3 V</text>
  <rect x="980" y="110" width="450" height="100" rx="18" class="b"/><text x="1205" y="150" text-anchor="middle" class="n">Pin names are placeholders.</text><text x="1205" y="185" text-anchor="middle" class="l">Use the verified inventory record.</text>
</svg>

