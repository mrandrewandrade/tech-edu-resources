<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Steps 3 and 4: move the playhead and add a keyframe</title>
  <desc id="desc">An enlarged smooth.video timeline. A black vertical playhead is at two seconds. A diamond on the selected sun row is circled and labelled keyframe. Instructions explain that moving or resizing the object creates a keyframe automatically, or the hollow diamond can be clicked.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc6b2f"/></marker>
    <style>
      .title{font:800 34px system-ui,sans-serif;fill:#10233d}.label{font:750 27px system-ui,sans-serif;fill:#10233d}.ui{font:650 20px system-ui,sans-serif;fill:#334155}.time{font:650 16px system-ui,sans-serif;fill:#64748b}.arrow{fill:none;stroke:#dc6b2f;stroke-width:6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="610" rx="28" fill="#f5f7fb"/>
  <text x="48" y="58" class="title">Make a keyframe: move the line, then change the picture</text>

  <rect x="54" y="96" width="1092" height="286" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <g class="time" text-anchor="middle">
    <text x="180" y="135">0 s</text><text x="370" y="135">1 s</text><text x="560" y="135">2 s</text><text x="750" y="135">3 s</text><text x="940" y="135">4 s</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="2"><line x1="180" y1="143" x2="180" y2="160"/><line x1="370" y1="143" x2="370" y2="160"/><line x1="560" y1="143" x2="560" y2="160"/><line x1="750" y1="143" x2="750" y2="160"/><line x1="940" y1="143" x2="940" y2="160"/></g>
  <text x="92" y="208" class="ui">sun</text>
  <rect x="160" y="170" width="910" height="66" rx="12" fill="#e5e9ef" stroke="#2563eb" stroke-width="3"/>
  <polygon points="370,190 383,203 370,216 357,203" fill="#475569"/>
  <polygon points="560,188 575,203 560,218 545,203" fill="#111827"/>
  <polygon points="750,190 763,203 750,216 737,203" fill="#475569"/>
  <polygon points="940,190 953,203 940,216 927,203" fill="#475569"/>
  <line x1="560" y1="132" x2="560" y2="302" stroke="#111827" stroke-width="5"/>
  <rect x="515" y="94" width="90" height="42" rx="20" fill="#111827"/>
  <text x="560" y="122" text-anchor="middle" style="font:750 19px system-ui,sans-serif;fill:#fff">2.00 s</text>
  <circle cx="560" cy="203" r="35" fill="none" stroke="#dc6b2f" stroke-width="7"/>
  <text x="701" y="286" class="label">Diamond = keyframe</text>
  <path d="M690 274 C636 268 610 242 584 217" class="arrow"/>

  <rect x="54" y="420" width="518" height="142" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="93" cy="462" r="26" fill="#2563eb"/>
  <text x="85" y="471" style="font:800 25px system-ui,sans-serif;fill:#fff">3</text>
  <text x="132" y="459" class="label">Move the playhead</text>
  <text x="83" y="500" class="ui">Drag the black vertical line to a new time.</text>
  <text x="83" y="532" class="ui">Do this before moving or resizing anything.</text>

  <rect x="594" y="420" width="552" height="142" rx="18" fill="#fff7ed" stroke="#dc6b2f" stroke-width="3"/>
  <circle cx="633" cy="462" r="26" fill="#dc6b2f"/>
  <text x="625" y="471" style="font:800 25px system-ui,sans-serif;fill:#fff">4</text>
  <text x="672" y="459" class="label">Change the picture</text>
  <text x="623" y="500" class="ui">Move, resize, or rotate it. The diamond appears.</text>
  <text x="623" y="532" class="ui">You can also click the small hollow diamond.</text>
</svg>

