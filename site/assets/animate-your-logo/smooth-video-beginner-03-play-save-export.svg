<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Steps 5 to 7: play, save, and export the animation</title>
  <desc id="desc">Three large labelled panels show the triangular Play button, the Menu with Save project, and the Export menu with MP4 and GIF.</desc>
  <defs><style>.title{font:800 34px system-ui,sans-serif;fill:#10233d}.label{font:800 28px system-ui,sans-serif;fill:#10233d}.ui{font:650 21px system-ui,sans-serif;fill:#334155}.small{font:600 18px system-ui,sans-serif;fill:#64748b}</style></defs>
  <rect width="1200" height="620" rx="28" fill="#f5f7fb"/>
  <text x="48" y="58" class="title">Finish every practice: Play → Save project → Export</text>

  <g transform="translate(48 105)">
    <rect width="336" height="450" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="45" cy="48" r="27" fill="#2563eb"/><text x="37" y="57" style="font:800 25px system-ui,sans-serif;fill:#fff">5</text>
    <text x="86" y="57" class="label">Play it</text>
    <rect x="30" y="102" width="276" height="215" rx="14" fill="#eef1f5"/>
    <circle cx="168" cy="207" r="65" fill="#fff" stroke="#94a3b8" stroke-width="4"/>
    <path d="m145 167 62 40-62 40Z" fill="#111827"/>
    <text x="32" y="360" class="ui">Press the triangle or</text><text x="32" y="390" class="ui">press the space bar.</text>
    <text x="32" y="424" class="small">Watch all four seconds.</text>
  </g>

  <g transform="translate(432 105)">
    <rect width="336" height="450" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="45" cy="48" r="27" fill="#2563eb"/><text x="37" y="57" style="font:800 25px system-ui,sans-serif;fill:#fff">6</text>
    <text x="86" y="57" class="label">Save the project</text>
    <rect x="30" y="100" width="66" height="55" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
    <path d="M49 117h28M49 127h28M49 137h28" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <rect x="30" y="166" width="244" height="158" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="54" y="205" class="ui">New project</text><text x="54" y="248" class="ui">Open project</text>
    <rect x="42" y="262" width="220" height="46" rx="8" fill="#fff7ed" stroke="#dc6b2f" stroke-width="3"/>
    <text x="61" y="292" class="ui">Save project</text>
    <text x="30" y="360" class="ui">Menu → Save project</text>
    <text x="30" y="397" class="small">Keep the .smooth file.</text>
  </g>

  <g transform="translate(816 105)">
    <rect width="336" height="450" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="45" cy="48" r="27" fill="#2563eb"/><text x="37" y="57" style="font:800 25px system-ui,sans-serif;fill:#fff">7</text>
    <text x="86" y="57" class="label">Export it</text>
    <rect x="30" y="100" width="150" height="55" rx="12" fill="#111827"/><text x="70" y="136" style="font:750 21px system-ui,sans-serif;fill:#fff">Export</text>
    <rect x="30" y="166" width="244" height="158" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="54" y="207" class="small">VIDEO</text>
    <rect x="42" y="220" width="220" height="42" rx="8" fill="#eaf2ff"/><text x="58" y="248" class="ui">MP4</text>
    <rect x="42" y="269" width="220" height="42" rx="8" fill="#fff7ed"/><text x="58" y="297" class="ui">GIF</text>
    <text x="30" y="360" class="ui">Choose MP4 or GIF.</text>
    <text x="30" y="397" class="small">Open the download to test it.</text>
  </g>
</svg>

