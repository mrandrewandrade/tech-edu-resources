  <line x1="218" y1="558" x2="1072" y2="558" stroke="#64748b" stroke-width="3"/>
  <rect x="330" y="544" width="532" height="28" rx="8" fill="#216147"/>
  <circle cx="428" cy="558" r="9" fill="#f6b52d"/>
  <circle cx="740" cy="558" r="9" fill="#f6b52d"/>
