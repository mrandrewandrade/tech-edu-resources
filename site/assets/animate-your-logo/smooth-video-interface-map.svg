<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Map of the smooth.video editor</title>
  <desc id="desc">A simplified editor map showing the Menu and Add media buttons at the top left, Animate controls on the right, a canvas in the middle, Play below it, and the timeline across the bottom.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a45a2a"/>
    </marker>
    <style>
      .label{font:700 28px system-ui,sans-serif;fill:#16324f}.small{font:600 22px system-ui,sans-serif;fill:#172033}.ui{font:600 17px system-ui,sans-serif;fill:#e2e8f0}.note{font:500 19px system-ui,sans-serif;fill:#475569}.arrow{stroke:#a45a2a;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="48" y="54" class="label">Where the main controls are</text>

  <rect x="68" y="92" width="1064" height="540" rx="20" fill="#0f172a"/>
  <rect x="68" y="92" width="1064" height="64" rx="20" fill="#1e293b"/>
  <rect x="68" y="136" width="1064" height="20" fill="#1e293b"/>
