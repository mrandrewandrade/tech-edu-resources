  <rect x="220" y="108" width="140" height="34" rx="7" fill="#216147"/>
  <text x="242" y="132" class="ui">Add media</text>
  <rect x="374" y="108" width="120" height="34" rx="7" fill="#334155"/>
  <text x="393" y="132" class="ui">Add text</text>
  <rect x="1006" y="108" width="98" height="34" rx="7" fill="#a45a2a"/>
  <text x="1024" y="132" class="ui">Export</text>

  <rect x="94" y="180" width="170" height="286" rx="12" fill="#1e293b"/>
  <text x="116" y="215" class="ui">Layers</text>
  <rect x="112" y="240" width="134" height="42" rx="7" fill="#334155"/>
  <text x="130" y="267" class="ui">Logo</text>
  <rect x="286" y="180" width="566" height="286" rx="12" fill="#e2e8f0"/>
  <circle cx="667" cy="280" r="62" fill="#f6b52d"/>
  <path d="M390 408 505 237 596 408Z" fill="#216147"/>
  <path d="M544 408 650 219 763 408Z" fill="#398260"/>
  <path d="m403 439 88-27 92-8 88 8 84 27-4 18-80-25-88-9-92 9-84 25Z" fill="#2679b7"/>
  <rect x="874" y="180" width="230" height="286" rx="12" fill="#1e293b"/>
  <text x="898" y="215" class="ui">Selected element</text>
  <rect x="896" y="240" width="186" height="44" rx="7" fill="#216147"/>
  <text x="957" y="268" class="ui">Animate</text>
  <text x="898" y="318" class="ui">Transform</text>
  <text x="898" y="356" class="ui">Effects</text>
