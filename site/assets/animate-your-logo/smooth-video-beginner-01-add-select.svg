<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Steps 1 and 2: add a picture and select it in smooth.video</title>
  <desc id="desc">A large labelled view of the smooth.video editor. The picture icon at top left is highlighted as Add media. The sun on the canvas has white selection handles to show that it is selected.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#dc6b2f"/>
    </marker>
    <style>
      .title{font:800 34px system-ui,sans-serif;fill:#10233d}.label{font:750 27px system-ui,sans-serif;fill:#10233d}.ui{font:650 19px system-ui,sans-serif;fill:#334155}.small{font:650 16px system-ui,sans-serif;fill:#475569}.call{fill:#fff7ed;stroke:#dc6b2f;stroke-width:4}.arrow{fill:none;stroke:#dc6b2f;stroke-width:6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#f5f7fb"/>
  <text x="48" y="55" class="title">Start here: add one picture, then select it</text>

  <rect x="52" y="86" width="1096" height="560" rx="18" fill="#eef1f5" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="72" y="108" width="50" height="46" rx="10" fill="#fff"/>
  <path d="M88 123h18M88 131h18M88 139h18" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <rect x="132" y="104" width="60" height="54" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <rect x="148" y="118" width="28" height="24" rx="3" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="169" cy="125" r="4" fill="#2563eb"/>
  <path d="m151 138 8-8 6 6 5-5 6 7" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="281" cy="131" r="13" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="315" y="118" width="27" height="27" rx="4" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="963" y="110" width="155" height="46" rx="10" fill="#111827"/>
  <text x="1002" y="140" style="font:750 20px system-ui,sans-serif;fill:#fff">Export</text>

  <rect x="356" y="180" width="480" height="330" fill="#0f1b33"/>
  <path d="M420 421 520 275 602 421Z" fill="#286747"/>
  <path d="M560 421 654 258 758 421Z" fill="#428b66"/>
  <path d="m432 454 80-23 84-8 82 8 76 23-4 17-72-21-82-8-84 8-76 21Z" fill="#2f83bd"/>
  <circle cx="730" cy="268" r="58" fill="#f7b62e"/>
  <rect x="666" y="204" width="128" height="128" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 7"/>
  <g fill="#fff" stroke="#cbd5e1" stroke-width="2">
    <rect x="657" y="195" width="18" height="18" rx="4"/><rect x="785" y="195" width="18" height="18" rx="4"/>
    <rect x="657" y="323" width="18" height="18" rx="4"/><rect x="785" y="323" width="18" height="18" rx="4"/>
  </g>

  <line x1="96" y1="552" x2="1090" y2="552" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="582" class="small">Play</text>
  <circle cx="103" cy="613" r="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="m96 600 18 13-18 13Z" fill="#334155"/>
  <text x="188" y="579" class="small">sun</text>
  <rect x="178" y="590" width="880" height="36" rx="10" fill="#dde3ea" stroke="#2563eb" stroke-width="3"/>
  <line x1="488" y1="565" x2="488" y2="635" stroke="#111827" stroke-width="4"/>

  <rect x="70" y="176" width="286" height="104" rx="16" class="call"/>
  <circle cx="100" cy="207" r="22" fill="#dc6b2f"/>
  <text x="93" y="216" style="font:800 24px system-ui,sans-serif;fill:#fff">1</text>
  <text x="132" y="211" class="label">Click the picture icon</text>
  <text x="94" y="250" class="ui">This is Add media.</text>
  <path d="M220 176 C208 150 190 142 177 139" class="arrow"/>

  <rect x="846" y="254" width="286" height="128" rx="16" class="call"/>
  <circle cx="878" cy="289" r="22" fill="#dc6b2f"/>
  <text x="871" y="298" style="font:800 24px system-ui,sans-serif;fill:#fff">2</text>
  <text x="910" y="292" class="label">Click your picture</text>
  <text x="870" y="329" class="ui">White handles mean it is</text>
  <text x="870" y="354" class="ui">selected and ready to move.</text>
  <path d="M846 324 C812 322 808 302 795 289" class="arrow"/>
</svg>

