<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Professional third-angle drawing for a faux-enamel brooch</title>
  <desc id="desc">A third-angle engineering drawing with the thin top view above the circular front view, the thin right-side view aligned to the right, and section A-A below. Dimensions identify a 2 inch diameter, 0.12 inch base, 0.04 inch raised walls, and 0.16 inch overall thickness.</desc>
  <defs>
    <marker id="dimArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 0 0 4 8 8Z" fill="#152235"/></marker>
    <marker id="sectionArrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#152235"/></marker>
    <pattern id="plasticHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#657287" stroke-width="1.4"/></pattern>
    <pattern id="fillA" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#edf2f7"/><circle cx="2" cy="2" r="1" fill="#748196"/></pattern>
    <pattern id="fillB" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#f5c84b"/><line x1="0" y1="0" x2="0" y2="9" stroke="#6b5516" stroke-width="1.5"/></pattern>
    <style>
      .sheet{fill:#fff;stroke:#687487;stroke-width:2}.heavy{fill:none;stroke:#152235;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.visible{fill:none;stroke:#152235;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#536176;stroke-width:1.35}.hidden{fill:none;stroke:#657287;stroke-width:1.5;stroke-dasharray:10 6}.centre{fill:none;stroke:#66748a;stroke-width:1.3;stroke-dasharray:24 6 4 6}.projection{fill:none;stroke:#a8b2c0;stroke-width:1.15;stroke-dasharray:5 7}.cut{fill:none;stroke:#152235;stroke-width:2;stroke-dasharray:20 7 4 7}.dim{fill:none;stroke:#152235;stroke-width:1.35;marker-start:url(#dimArrow);marker-end:url(#dimArrow)}.extension{fill:none;stroke:#657287;stroke-width:1.15}.base{fill:url(#plasticHatch);stroke:#152235;stroke-width:2.2}.wall{fill:#28364b;stroke:#152235;stroke-width:1.4}.fill-a{fill:url(#fillA);stroke:#152235;stroke-width:1}.fill-b{fill:url(#fillB);stroke:#152235;stroke-width:1}.title{font:700 25px Arial,sans-serif;letter-spacing:1.1px;fill:#152235}.subtitle{font:500 16px Arial,sans-serif;fill:#445168}.view{font:700 18px Arial,sans-serif;letter-spacing:1.5px;fill:#152235}.label{font:600 16px Arial,sans-serif;fill:#152235}.note{font:400 14px Arial,sans-serif;fill:#445168}.dimtext{font:600 15px Arial,sans-serif;fill:#152235}.tb-label{font:600 11px Arial,sans-serif;letter-spacing:.7px;fill:#59677b}.tb-value{font:600 14px Arial,sans-serif;fill:#152235}
    </style>
  </defs>

  <rect x="18" y="18" width="1364" height="964" class="sheet"/>
  <text x="52" y="62" class="title">FAUX-ENAMEL BROOCH - THIRD-ANGLE ORTHOGRAPHIC DRAWING</text>
  <text x="52" y="88" class="subtitle">2.00 in teacher example · decorated face is the FRONT view · dimensions in inches</text>
  <line x1="52" y1="108" x2="1348" y2="108" class="thin"/>

  <line x1="250" y1="236" x2="250" y2="320" class="projection"/><line x1="400" y1="236" x2="400" y2="320" class="projection"/><line x1="550" y1="236" x2="550" y2="320" class="projection"/>
  <line x1="550" y1="320" x2="700" y2="320" class="projection"/><line x1="550" y1="470" x2="700" y2="470" class="projection"/><line x1="550" y1="620" x2="700" y2="620" class="projection"/>

