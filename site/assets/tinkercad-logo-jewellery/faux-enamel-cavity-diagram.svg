    <circle cx="400" cy="470" r="150" fill="#f7f9fc" stroke="#152235" stroke-width="4"/><circle cx="400" cy="470" r="141" fill="none" stroke="#152235" stroke-width="6"/>
    <image x="310" y="376" width="180" height="180" href="../branding/logo/aa-logo.svg" xlink:href="../branding/logo/aa-logo.svg" preserveAspectRatio="xMidYMid meet"/>
    <line x1="220" y1="470" x2="580" y2="470" class="centre"/><line x1="400" y1="290" x2="400" y2="650" class="centre"/>
    <line x1="238" y1="470" x2="562" y2="470" class="cut"/><line x1="238" y1="470" x2="205" y2="470" class="visible" marker-end="url(#sectionArrow)"/><line x1="562" y1="470" x2="595" y2="470" class="visible" marker-end="url(#sectionArrow)"/><text x="192" y="476" text-anchor="end" class="label">A</text><text x="608" y="476" class="label">A</text>
    <line x1="230" y1="335" x2="192" y2="300" class="extension"/><line x1="570" y1="335" x2="608" y2="300" class="extension"/><line x1="207" y1="315" x2="593" y2="315" class="dim"/><rect x="360" y="302" width="80" height="24" fill="#fff"/><text x="400" y="319" text-anchor="middle" class="dimtext">Ø2.00 in</text>
  </g>

  <g aria-label="Right-side view">
    <text x="770" y="304" text-anchor="middle" class="view">RIGHT SIDE</text>
    <path d="M730 320H754V620H730Z" class="heavy"/><path d="M724 320H730M724 328H730M724 462H730M724 478H730M724 612H730M724 620H730" class="heavy"/><line x1="700" y1="470" x2="780" y2="470" class="centre"/>
    <line x1="802" y1="320" x2="826" y2="320" class="extension"/><line x1="802" y1="620" x2="826" y2="620" class="extension"/><line x1="816" y1="320" x2="816" y2="620" class="dim"/><rect x="788" y="447" width="56" height="46" fill="#fff"/><text x="816" y="465" text-anchor="middle" class="dimtext">2.00</text><text x="816" y="483" text-anchor="middle" class="note">in DIA</text>
  </g>

  <g aria-label="Section A-A">
    <text x="400" y="704" text-anchor="middle" class="view">SECTION A–A</text>
    <rect x="250" y="790" width="300" height="54" class="base"/><rect x="250" y="772" width="10" height="72" class="wall"/><rect x="338" y="772" width="10" height="72" class="wall"/><rect x="452" y="772" width="10" height="72" class="wall"/><rect x="540" y="772" width="10" height="72" class="wall"/>
    <rect x="260" y="776" width="78" height="14" class="fill-a"/><rect x="348" y="776" width="104" height="14" class="fill-b"/><rect x="462" y="776" width="78" height="14" class="fill-a"/>
    <text x="299" y="751" text-anchor="middle" class="note">BACKGROUND FILL</text><line x1="299" y1="756" x2="299" y2="776" class="thin"/><text x="400" y="751" text-anchor="middle" class="note">LOGO FILL</text><line x1="400" y1="756" x2="400" y2="776" class="thin"/><text x="501" y="751" text-anchor="middle" class="note">BACKGROUND FILL</text><line x1="501" y1="756" x2="501" y2="776" class="thin"/>
    <line x1="568" y1="772" x2="620" y2="772" class="extension"/><line x1="568" y1="790" x2="620" y2="790" class="extension"/><line x1="568" y1="844" x2="620" y2="844" class="extension"/><line x1="604" y1="772" x2="604" y2="790" class="dim"/><line x1="604" y1="790" x2="604" y2="844" class="dim"/><text x="628" y="786" class="dimtext">0.04 in wall / recess</text><text x="628" y="823" class="dimtext">0.12 in base</text>
    <line x1="660" y1="772" x2="688" y2="772" class="extension"/><line x1="660" y1="844" x2="688" y2="844" class="extension"/><line x1="676" y1="772" x2="676" y2="844" class="dim"/><text x="700" y="812" class="dimtext">0.16 in overall</text>
    <line x1="250" y1="874" x2="550" y2="874" class="dim"/><line x1="250" y1="852" x2="250" y2="888" class="extension"/><line x1="550" y1="852" x2="550" y2="888" class="extension"/><rect x="365" y="862" width="70" height="24" fill="#fff"/><text x="400" y="879" text-anchor="middle" class="dimtext">2.00 in</text>
  </g>

  <g aria-label="Drawing notes">
    <text x="900" y="152" class="view">DESIGN NOTES</text><text x="900" y="184" class="note">1. Raised walls and outer rim: 0.05 in minimum width.</text><text x="900" y="210" class="note">2. Fill must remain below the top of the walls.</text><text x="900" y="236" class="note">3. Back face remains flat for glue-on hardware.</text><text x="900" y="262" class="note">4. Remove pockets too small to fill or print cleanly.</text>
    <text x="900" y="322" class="view">THIRD-ANGLE SYMBOL</text><path d="M920 362L1010 348V422L920 408Z" class="visible"/><line x1="942" y1="359" x2="942" y2="411" class="visible"/><line x1="990" y1="351" x2="990" y2="419" class="visible"/><ellipse cx="1080" cy="385" rx="36" ry="36" class="visible"/><ellipse cx="1080" cy="385" rx="14" ry="36" class="visible"/><line x1="1044" y1="385" x2="1116" y2="385" class="centre"/><text x="900" y="452" class="note">Circle on the right = third-angle projection.</text>
    <text x="900" y="520" class="view">SECTION KEY</text><rect x="900" y="544" width="56" height="22" class="base"/><text x="970" y="561" class="note">PRINTED PLASTIC (CUT)</text><rect x="900" y="582" width="56" height="22" class="fill-a"/><text x="970" y="599" class="note">BACKGROUND COLOUR</text><rect x="900" y="620" width="56" height="22" class="fill-b"/><text x="970" y="637" class="note">LOGO COLOUR</text><rect x="900" y="658" width="56" height="22" class="wall"/><text x="970" y="675" class="note">RAISED WALL / RIM</text>
  </g>

  <g aria-label="Title block">
    <rect x="840" y="760" width="508" height="188" class="visible"/><line x1="840" y1="816" x2="1348" y2="816" class="thin"/><line x1="840" y1="870" x2="1348" y2="870" class="thin"/><line x1="1060" y1="816" x2="1060" y2="948" class="thin"/><line x1="1220" y1="816" x2="1220" y2="948" class="thin"/>
    <text x="858" y="782" class="tb-label">DRAWING TITLE</text><text x="858" y="806" class="tb-value">2.00 in FAUX-ENAMEL BROOCH - CONSTRUCTION</text><text x="858" y="838" class="tb-label">DRAWING TYPE</text><text x="858" y="861" class="tb-value">THIRD-ANGLE ORTHOGRAPHIC + SECTION</text><text x="1078" y="838" class="tb-label">UNITS</text><text x="1078" y="861" class="tb-value">in</text><text x="1238" y="838" class="tb-label">SCALE</text><text x="1238" y="861" class="tb-value">NTS</text><text x="858" y="894" class="tb-label">MODEL</text><text x="858" y="921" class="tb-value">BROOCH 2.00</text><text x="1078" y="894" class="tb-label">BASE / WALL</text><text x="1078" y="921" class="tb-value">0.12 / 0.04</text><text x="1238" y="894" class="tb-label">PROJECTION</text><text x="1238" y="921" class="tb-value">3rd ANGLE</text>
  </g>

  <text x="52" y="966" class="note">Teacher example only. Students use their own original logo; adapt diameter from the project dimension table.</text>
</svg>
