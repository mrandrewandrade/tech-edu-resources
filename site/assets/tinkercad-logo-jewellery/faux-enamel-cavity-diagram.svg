    <text x="400" y="142" text-anchor="middle" class="view">TOP</text>
    <path d="M250 198H550V222H250Z" class="heavy"/><path d="M250 192V198M258 192V198M392 192V198M408 192V198M542 192V198M550 192V198" class="heavy"/><line x1="400" y1="170" x2="400" y2="244" class="centre"/>
    <line x1="250" y1="248" x2="250" y2="272" class="extension"/><line x1="550" y1="248" x2="550" y2="272" class="extension"/><line x1="250" y1="262" x2="550" y2="262" class="dim"/><rect x="365" y="250" width="70" height="23" fill="#fff"/><text x="400" y="267" text-anchor="middle" class="dimtext">2.00 in</text>
  </g>

