<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Example of a clean, customized Linux Xfce desktop</title>
  <desc id="description">A calm blue and green wallpaper, a dark bottom panel, a tidy file manager, and a readable terminal demonstrate one possible student desktop.</desc>
  <defs>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10273d"/>
      <stop offset="0.55" stop-color="#155e75"/>
      <stop offset="1" stop-color="#43a047"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ee8ff" stop-opacity="0.33"/>
      <stop offset="1" stop-color="#d3ffd8" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#07131f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="22" fill="url(#wallpaper)"/>
  <circle cx="995" cy="95" r="260" fill="url(#glow)"/>
  <path d="M0 530 C230 420 380 600 610 490 C850 375 1010 505 1200 390 L1200 675 L0 675 Z" fill="#071f2b" opacity="0.25"/>
  <path d="M0 578 C250 480 420 640 685 530 C920 430 1070 535 1200 470 L1200 675 L0 675 Z" fill="#0a1620" opacity="0.34"/>

  <g font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#f3fbff">
    <g transform="translate(34 36)">
      <rect width="72" height="72" rx="16" fill="#ffffff" opacity="0.14"/>
      <path d="M17 29h16l6 7h20v24H17z" fill="#ffd166"/>
      <path d="M17 33h42v7H17z" fill="#f4b942"/>
      <text x="36" y="96" text-anchor="middle">Home</text>
    </g>
    <g transform="translate(34 155)">
      <rect width="72" height="72" rx="16" fill="#ffffff" opacity="0.14"/>
      <rect x="18" y="18" width="36" height="40" rx="4" fill="#c9e6f2"/>
      <path d="M27 29h18M27 37h18M27 45h13" stroke="#155e75" stroke-width="3" stroke-linecap="round"/>
      <text x="36" y="96" text-anchor="middle">Projects</text>
    </g>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, sans-serif">
    <g transform="translate(160 105)">
      <rect width="520" height="365" rx="13" fill="#f7fafc"/>
      <path d="M13 0h494a13 13 0 0 1 13 13v35H0V13A13 13 0 0 1 13 0z" fill="#243447"/>
      <circle cx="24" cy="24" r="6" fill="#ff6b6b"/>
      <circle cx="44" cy="24" r="6" fill="#ffd166"/>
      <circle cx="64" cy="24" r="6" fill="#63d471"/>
      <text x="260" y="29" text-anchor="middle" font-size="15" fill="#f7fafc">File Manager</text>
      <rect x="0" y="48" width="120" height="317" fill="#e9f1f5"/>
      <g font-size="14" fill="#30475e">
        <text x="24" y="82">Home</text>
        <text x="24" y="113">Desktop</text>
        <text x="24" y="144">Documents</text>
        <text x="24" y="175">Downloads</text>
        <text x="24" y="206">Games</text>
      </g>
      <text x="148" y="84" font-size="18" font-weight="700" fill="#213547">Home</text>
      <g transform="translate(150 112)">
        <g>
          <rect width="88" height="86" rx="10" fill="#eef5f7"/>
          <path d="M18 28h24l8 9h22v29H18z" fill="#ffd166"/>
          <text x="44" y="78" text-anchor="middle" font-size="13" fill="#30475e">Documents</text>
        </g>
        <g transform="translate(110)">
          <rect width="88" height="86" rx="10" fill="#eef5f7"/>
          <path d="M18 28h24l8 9h22v29H18z" fill="#ffd166"/>
          <text x="44" y="78" text-anchor="middle" font-size="13" fill="#30475e">Games</text>
        </g>
        <g transform="translate(220)">
          <rect width="88" height="86" rx="10" fill="#eef5f7"/>
          <path d="M18 28h24l8 9h22v29H18z" fill="#ffd166"/>
          <text x="44" y="78" text-anchor="middle" font-size="13" fill="#30475e">Pictures</text>
        </g>
      </g>
      <rect x="150" y="228" width="320" height="90" rx="12" fill="#e6f6ee"/>
      <text x="170" y="258" font-size="14" font-weight="700" fill="#176b3a">A tidy workspace</text>
      <text x="170" y="282" font-size="13" fill="#30475e">Clear folders make projects easy to find.</text>
      <text x="170" y="304" font-size="13" fill="#30475e">The desktop stays calm and uncluttered.</text>
    </g>

    <g transform="translate(585 225)">
      <rect width="500" height="285" rx="13" fill="#101820"/>
      <path d="M13 0h474a13 13 0 0 1 13 13v35H0V13A13 13 0 0 1 13 0z" fill="#1f2c38"/>
      <circle cx="24" cy="24" r="6" fill="#ff6b6b"/>
      <circle cx="44" cy="24" r="6" fill="#ffd166"/>
      <circle cx="64" cy="24" r="6" fill="#63d471"/>
      <text x="250" y="29" text-anchor="middle" font-size="15" fill="#f7fafc">Terminal</text>
      <g font-family="Cascadia Mono, Consolas, monospace" font-size="16">
        <text x="25" y="82" fill="#72e0a2">student@mint</text><text x="145" y="82" fill="#d8e5ee">:~$ whoami</text>
        <text x="25" y="110" fill="#d8e5ee">student</text>
        <text x="25" y="144" fill="#72e0a2">student@mint</text><text x="145" y="144" fill="#d8e5ee">:~$ pwd</text>
        <text x="25" y="172" fill="#d8e5ee">/home/student</text>
        <text x="25" y="206" fill="#72e0a2">student@mint</text><text x="145" y="206" fill="#d8e5ee">:~$ git --version</text>
        <text x="25" y="234" fill="#d8e5ee">git version 2.x</text>
        <rect x="25" y="253" width="10" height="18" fill="#72e0a2"/>
      </g>
    </g>
  </g>

  <g transform="translate(126 590)" font-family="Inter, Segoe UI, sans-serif">
    <rect width="948" height="62" rx="20" fill="#0a1118" opacity="0.92" filter="url(#shadow)"/>
    <circle cx="38" cy="31" r="21" fill="#4caf50"/>
    <path d="M28 32c6-12 15-12 22 0-7 12-16 12-22 0z" fill="#f7fff8"/>
    <rect x="84" y="13" width="38" height="38" rx="10" fill="#314250"/>
    <path d="M93 25h9l4 5h8v12H93z" fill="#ffd166"/>
    <rect x="136" y="13" width="38" height="38" rx="10" fill="#314250"/>
    <path d="M146 23h18v16h-18z" fill="none" stroke="#72e0a2" stroke-width="2"/>
    <path d="m149 28 4 4-4 4m6 0h6" fill="none" stroke="#72e0a2" stroke-width="2"/>
    <rect x="188" y="13" width="38" height="38" rx="10" fill="#314250"/>
    <circle cx="207" cy="32" r="10" fill="#55b6ff"/>
    <path d="M203 24c7 4 8 10 2 17" fill="none" stroke="#fff" stroke-width="2"/>
    <g transform="translate(742 0)" fill="#d8e5ee" font-size="14">
      <text x="0" y="37">Wi-Fi</text>
      <text x="55" y="37">Sound</text>
      <text x="122" y="37">10:24</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">
    <g transform="translate(764 56)">
      <rect width="300" height="46" rx="12" fill="#ffffff" opacity="0.93"/>
      <text x="150" y="29" text-anchor="middle" fill="#183347">Calm wallpaper and readable colours</text>
    </g>
    <g transform="translate(762 535)">
      <rect width="302" height="42" rx="12" fill="#ffffff" opacity="0.93"/>
      <text x="151" y="27" text-anchor="middle" fill="#183347">Favourite apps and controls stay easy to find</text>
    </g>
  </g>
</svg>
